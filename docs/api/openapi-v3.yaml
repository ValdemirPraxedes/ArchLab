          $ref: '#/components/schemas/TraceResultV3'
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineActivityV3'
        metrics:
          $ref: '#/components/schemas/SimulationMetricsV3'
        integrity:
          $ref: '#/components/schemas/ResultIntegrityV3'
        reconstruction:
          $ref: '#/components/schemas/StateReconstructionV3'
        fullRuntimeReconstruction:
          $ref: '#/components/schemas/FullRuntimeReconstructionV3'
      required:
      - metadata
      - principal
      - global
      - initialState
      - finalState
      - trace
      - timeline
      - metrics
      - integrity
      additionalProperties: false
      description: 'Regras semânticas adicionais: trace.recordCount=len(trace.records), counters.traceRecordCount>=recordCount,
        trace.completeness=integrity.traceCompleteness, tempo observado consistente, métricas compatíveis com principal/global,
        sequências de trace estritamente crescentes. API-V3-005 permite reconstruction opcional, com prova de equivalência
        apenas do PUBLIC_SNAPSHOT. playbackReconstructible permanece false sem cobertura FULL_RUNTIME. API-V3-006:
        fullRuntimeReconstruction opcional; nao e suficiente para declarar reexecucao deterministica validada. API-V3-006:
        fullRuntimeReconstruction opcional; nao e suficiente para declarar reexecucao deterministica validada.'
    TraceKindV3:
      type: string
      enum:
      - EXECUTION_STARTED
      - ROOT_OPERATION_STARTED
      - ACTIVATION_CREATED
      - ACTIVATION_STATE_CHANGED
      - INTERACTION_STATE_CHANGED
      - ATTEMPT_STATE_CHANGED
      - STEP_STARTED
      - STEP_FINISHED
      - STEP_TRANSITION_SELECTED
      - MESSAGE_SENT
      - MESSAGE_ARRIVED
      - MESSAGE_DELIVERY_FAILED
      - RESPONSE_SENT
      - RESPONSE_ARRIVED
      - RESPONSE_ARRIVED_LATE
      - JOIN_EVALUATED
      - JOIN_SATISFIED
      - JOIN_UNSATISFIABLE
      - RESOURCE_ACQUIRED
      - RESOURCE_RELEASED
      - RESOURCE_WAIT_STARTED
      - RESOURCE_STATE_CHANGED
      - RETRY_SCHEDULED
      - RETRY_STARTED
      - BROKER_ACCEPTED
