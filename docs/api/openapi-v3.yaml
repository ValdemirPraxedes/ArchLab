openapi: 3.1.0
info:
  title: ArchLab Simulation API v3
  version: 0.3.0-draft
  description: Contrato de planejamento API-V3-001. Sem implementação ou persistência. Limites operacionais numéricos
    permanecem provisórios. A semântica de domínio é validada no core.
servers:
- url: /
tags:
- name: Architectures
- name: ExecutionPlans
- name: Scenarios
- name: Simulations
paths:
  /api/v3/architectures/validate:
    post:
      tags:
      - Architectures
      operationId: validateArchitectureV3
      summary: Valida arquitetura tipada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchitectureDefinitionV3'
      responses:
        '200':
          description: Validação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponseV3'
        '400':
          description: JSON inválido ou schema incompatível
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '413':
          description: Payload excessivo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '415':
          description: Media type não suportado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '500':
          description: Falha interna do ArchLab
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
  /api/v3/execution-plans/validate:
    post:
      tags:
      - ExecutionPlans
      operationId: validateExecutionPlanV3
      summary: Valida um plano candidato no contexto da arquitetura
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionPlanValidationRequestV3'
      responses:
        '200':
          description: Validação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponseV3'
        '400':
          description: JSON inválido ou schema incompatível
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '413':
          description: Payload excessivo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '415':
          description: Media type não suportado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '500':
          description: Falha interna do ArchLab
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
  /api/v3/scenarios/validate:
    post:
      tags:
      - Scenarios
      operationId: validateScenarioV3
      summary: Valida cenário completo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequestV3'
      responses:
        '200':
          description: Validação concluída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponseV3'
        '400':
          description: JSON inválido ou schema incompatível
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '413':
          description: Payload excessivo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '415':
          description: Media type não suportado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '500':
          description: Falha interna do ArchLab
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
  /api/v3/simulations:
    post:
      tags:
      - Simulations
      operationId: executeSimulationV3
      summary: Executa cenário determinístico em memória
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequestV3'
      responses:
        '200':
          description: Simulação concluída ou encerrada pelo motor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponseV3'
        '400':
          description: JSON inválido ou schema incompatível
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '413':
          description: Payload excessivo
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '415':
          description: Media type não suportado
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '500':
          description: Falha interna do ArchLab
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
        '422':
          description: Domínio/cenário inválido
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemV3'
components:
  schemas:
    IdentifierV3:
      type: string
      minLength: 1
      maxLength: 128
      pattern: .*\S.*
    DurationMsV3:
      type: integer
      minimum: 0
      format: int64
      description: Milissegundos virtuais, limites de servidor provisórios
    Integer64V3:
      type: integer
      format: int64
    NullableDurationV3:
      oneOf:
      - $ref: '#/components/schemas/DurationMsV3'
      - type: 'null'
    NullableIdentifierV3:
      oneOf:
      - $ref: '#/components/schemas/IdentifierV3'
      - type: 'null'
    JsonPointerV3:
      type: string
      pattern: ^(/.*)?$
    StringValueV3:
      type: object
      properties:
        kind:
          const: STRING
        value:
          type: string
          minLength: 0
      required:
      - kind
      - value
      additionalProperties: false
    IntegerValueV3:
      type: object
      properties:
        kind:
          const: INTEGER
        value:
          $ref: '#/components/schemas/Integer64V3'
      required:
      - kind
      - value
      additionalProperties: false
    DecimalValueV3:
      type: object
      properties:
        kind:
          const: DECIMAL
        value:
          type: string
          pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]+)?$
      required:
      - kind
      - value
      additionalProperties: false
    BooleanValueV3:
      type: object
      properties:
        kind:
          const: BOOLEAN
        value:
          type: boolean
      required:
      - kind
      - value
      additionalProperties: false
    EnumValueV3:
      type: object
      properties:
        kind:
          const: ENUM
        value:
          type: string
          minLength: 1
      required:
      - kind
      - value
      additionalProperties: false
    ReferenceValueV3:
      type: object
      properties:
        kind:
          const: REFERENCE
        targetId:
          $ref: '#/components/schemas/IdentifierV3'
        expectedTypeId:
          $ref: '#/components/schemas/IdentifierV3'
      required:
      - kind
      - targetId
      - expectedTypeId
      additionalProperties: false
    ListValueV3:
      type: object
      properties:
        kind:
          const: LIST
        values:
          type: array
          items:
            $ref: '#/components/schemas/PropertyValueV3'
          maxItems: 1000
      required:
      - kind
      - values
      additionalProperties: false
    ObjectValueV3:
      type: object
      properties:
        kind:
          const: OBJECT
        fields:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PropertyValueV3'
          maxProperties: 200
      required:
      - kind
      - fields
      additionalProperties: false
    PropertyValueV3:
      oneOf:
      - $ref: '#/components/schemas/StringValueV3'
      - $ref: '#/components/schemas/IntegerValueV3'
      - $ref: '#/components/schemas/DecimalValueV3'
      - $ref: '#/components/schemas/BooleanValueV3'
      - $ref: '#/components/schemas/EnumValueV3'
      - $ref: '#/components/schemas/ListValueV3'
      - $ref: '#/components/schemas/ObjectValueV3'
      - $ref: '#/components/schemas/ReferenceValueV3'
      description: União discriminada pelo campo kind
    PropertiesV3:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/PropertyValueV3'
    ComponentDefinitionV3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IdentifierV3'
        typeId:
          $ref: '#/components/schemas/IdentifierV3'
        displayName:
          type: string
          minLength: 1
        properties:
          $ref: '#/components/schemas/PropertiesV3'
      required:
      - id
      - typeId
      - displayName
      - properties
      additionalProperties: false
    ResourceDefinitionV3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IdentifierV3'
        typeId:
          $ref: '#/components/schemas/IdentifierV3'
        ownerId:
          $ref: '#/components/schemas/IdentifierV3'
        properties:
          $ref: '#/components/schemas/PropertiesV3'
      required:
      - id
      - typeId
      - ownerId
      - properties
      additionalProperties: false
    EndpointDefinitionV3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IdentifierV3'
        ownerId:
          $ref: '#/components/schemas/IdentifierV3'
        direction:
          type: string
          enum:
          - INBOUND
          - OUTBOUND
          - BIDIRECTIONAL
        protocolProfileId:
          $ref: '#/components/schemas/IdentifierV3'
        operationIds:
          type: array
          items:
            $ref: '#/components/schemas/IdentifierV3'
        properties:
          $ref: '#/components/schemas/PropertiesV3'
      required:
      - id
      - ownerId
      - direction
      - protocolProfileId
      - operationIds
      additionalProperties: false
    ExecutionPlanBindingV3:
      type: object
      properties:
        kind:
          const: EXECUTION_PLAN
        referenceId:
          $ref: '#/components/schemas/IdentifierV3'
      required:
      - kind
      - referenceId
      additionalProperties: false
    NativeBehaviorBindingV3:
      type: object
      properties:
        kind:
          const: NATIVE_BEHAVIOR
        referenceId:
          $ref: '#/components/schemas/IdentifierV3'
      required:
      - kind
      - referenceId
      additionalProperties: false
    OperationExecutionV3:
      oneOf:
      - $ref: '#/components/schemas/ExecutionPlanBindingV3'
      - $ref: '#/components/schemas/NativeBehaviorBindingV3'
      description: União discriminada pelo campo kind
    OperationDefinitionV3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IdentifierV3'
        ownerId:
          $ref: '#/components/schemas/IdentifierV3'
        displayName:
          type: string
          minLength: 1
        inputContractId:
          $ref: '#/components/schemas/IdentifierV3'
        outputContractId:
          $ref: '#/components/schemas/IdentifierV3'
        execution:
          $ref: '#/components/schemas/OperationExecutionV3'
        requiredCapabilities:
          type: array
          items:
            $ref: '#/components/schemas/IdentifierV3'
      required:
      - id
      - ownerId
      - displayName
      - execution
      additionalProperties: false
    CommunicationRelationV3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IdentifierV3'
        kind:
          const: COMMUNICATION
        sourceEndpointId:
          $ref: '#/components/schemas/IdentifierV3'
        targetEndpointId:
          $ref: '#/components/schemas/IdentifierV3'
        protocolProfileId:
          $ref: '#/components/schemas/IdentifierV3'
        properties:
          $ref: '#/components/schemas/PropertiesV3'
      required:
      - id
      - kind
      - sourceEndpointId
      - targetEndpointId
      - protocolProfileId
      additionalProperties: false
    StructuralRelationV3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IdentifierV3'
        kind:
          type: string
          enum:
          - HOSTING
          - CONTAINMENT
          - MANAGEMENT
          - POLICY_ATTACHMENT
          - RESOURCE_OWNERSHIP
        sourceId:
          $ref: '#/components/schemas/IdentifierV3'
        targetId:
          $ref: '#/components/schemas/IdentifierV3'
        properties:
          $ref: '#/components/schemas/PropertiesV3'
      required:
      - id
      - kind
      - sourceId
      - targetId
      additionalProperties: false
    RelationDefinitionV3:
      oneOf:
      - $ref: '#/components/schemas/CommunicationRelationV3'
      - $ref: '#/components/schemas/StructuralRelationV3'
      description: União discriminada pelo campo kind
    StepTransitionsV3:
      type: object
      minProperties: 1
      propertyNames:
        type: string
        enum:
        - NEXT
        - DISPATCHED
        - SUCCESS
        - BUSINESS_REJECTION
        - ACCEPTED
        - REJECTED
        - FAILURE
        - TIMEOUT
        - CANCELLED
        - 'TRUE'
        - 'FALSE'
        - ERROR
        - SATISFIED
        - UNSATISFIABLE
      additionalProperties:
        $ref: '#/components/schemas/IdentifierV3'
    PlanLimitsV3:
      type: object
      properties:
        maxStepExecutions:
          type: integer
          minimum: 1
        maxIterations:
          type: integer
          minimum: 1
      required:
      - maxStepExecutions
      - maxIterations
      additionalProperties: false
    LiteralOperandV3:
      type: object
      properties:
        kind:
          const: LITERAL
        value:
          oneOf:
          - type: string
          - type: boolean
          - type: integer
          - type: 'null'
      required:
      - kind
      - value
      additionalProperties: false
    ReferenceOperandV3:
      type: object
      properties:
        kind:
          const: REFERENCE
        path:
          type: string
          minLength: 1
      required:
      - kind
      - path
      additionalProperties: false
    ConditionOperandV3:
      oneOf:
      - $ref: '#/components/schemas/LiteralOperandV3'
      - $ref: '#/components/schemas/ReferenceOperandV3'
      description: União discriminada pelo campo kind
    CompareConditionV3:
      type: object
      properties:
        op:
          type: string
          enum:
          - EQ
          - NE
          - GT
          - GTE
          - LT
          - LTE
        left:
          $ref: '#/components/schemas/ConditionOperandV3'
        right:
          $ref: '#/components/schemas/ConditionOperandV3'
      required:
      - op
      - left
      - right
      additionalProperties: false
    ExistsConditionV3:
      type: object
      properties:
        op:
          const: EXISTS
        operand:
          $ref: '#/components/schemas/ConditionOperandV3'
      required:
      - op
      - operand
      additionalProperties: false
    AndOrConditionV3:
      type: object
      properties:
        op:
          type: string
          enum:
          - AND
          - OR
        conditions:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/ConditionExpressionV3'
      required:
      - op
      - conditions
      additionalProperties: false
    NotConditionV3:
      type: object
      properties:
        op:
          const: NOT
        condition:
          $ref: '#/components/schemas/ConditionExpressionV3'
      required:
      - op
      - condition
      additionalProperties: false
    ConditionExpressionV3:
      oneOf:
      - $ref: '#/components/schemas/CompareConditionV3'
      - $ref: '#/components/schemas/ExistsConditionV3'
      - $ref: '#/components/schemas/AndOrConditionV3'
      - $ref: '#/components/schemas/NotConditionV3'
      description: União discriminada pelo campo op
    ProcessStepV3:
      type: object
      properties:
        id: &id001
          $ref: '#/components/schemas/IdentifierV3'
        kind:
          const: PROCESS
        durationMs:
          $ref: '#/components/schemas/DurationMsV3'
        resourceProfileId:
          $ref: '#/components/schemas/IdentifierV3'
        transitions:
          $ref: '#/components/schemas/StepTransitionsV3'
      required:
      - id
      - kind
      - durationMs
      - transitions
      additionalProperties: false
    CallStepV3:
      type: object
      properties:
        id: *id001
        kind:
          const: CALL
        connectionId:
          $ref: '#/components/schemas/IdentifierV3'
        targetOperationId:
          $ref: '#/components/schemas/IdentifierV3'
        awaitMode:
          type: string
          enum:
          - NONE
          - RESPONSE
        policyRef:
          $ref: '#/components/schemas/IdentifierV3'
        transitions:
          $ref: '#/components/schemas/StepTransitionsV3'
      required:
      - id
      - kind
      - connectionId
      - targetOperationId
      - awaitMode
      - transitions
      additionalProperties: false
    PublishStepV3:
      type: object
      properties:
        id: *id001
        kind:
          const: PUBLISH
        targetResourceId:
          $ref: '#/components/schemas/IdentifierV3'
        payloadProfileId:
          $ref: '#/components/schemas/IdentifierV3'
        awaitMode:
          type: string
          enum:
          - NONE
          - BROKER_ACK
          - CONSUMER_ACK
        policyRef:
          $ref: '#/components/schemas/IdentifierV3'
        transitions:
          $ref: '#/components/schemas/StepTransitionsV3'
      required:
      - id
      - kind
      - targetResourceId
      - awaitMode
      - transitions
      additionalProperties: false
    ConditionStepV3:
      type: object
      properties:
        id: *id001
        kind:
          const: CONDITION
        expression:
          $ref: '#/components/schemas/ConditionExpressionV3'
        onTrue:
          $ref: '#/components/schemas/IdentifierV3'
        onFalse:
          $ref: '#/components/schemas/IdentifierV3'
        onError:
          $ref: '#/components/schemas/IdentifierV3'
      required:
      - id
      - kind
      - expression
      - onTrue
      - onFalse
      - onError
      additionalProperties: false
    BranchDefinitionV3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IdentifierV3'
        entryStepId:
          $ref: '#/components/schemas/IdentifierV3'
      required:
      - id
      - entryStepId
      additionalProperties: false
    ForkStepV3:
      type: object
      properties:
        id: *id001
        kind:
          const: FORK
        branches:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/BranchDefinitionV3'
        joinStepId:
          $ref: '#/components/schemas/IdentifierV3'
      required:
      - id
      - kind
      - branches
      - joinStepId
      additionalProperties: false
    JoinStepV3:
      type: object
      properties:
        id: *id001
        kind:
          const: JOIN
        policy:
          type: string
          enum:
          - ALL
          - ANY
          - FIRST_SUCCESS
          - QUORUM
        requiredBranchIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/IdentifierV3'
        quorum:
          type: integer
          minimum: 1
        remainingPolicy:
          type: string
          enum:
          - CONTINUE
          - CANCEL_REQUEST
          - IGNORE_RESULTS
        deadlineMs:
          $ref: '#/components/schemas/DurationMsV3'
        transitions:
          $ref: '#/components/schemas/StepTransitionsV3'
      required:
      - id
      - kind
      - policy
      - requiredBranchIds
      - remainingPolicy
      - transitions
      additionalProperties: false
      allOf:
      - if:
          properties:
            policy:
              const: QUORUM
          required:
          - policy
        then:
          required:
          - quorum
        else:
          not:
            required:
            - quorum
    DelayStepV3:
      type: object
      properties:
        id: *id001
        kind:
          const: DELAY
        durationMs:
          $ref: '#/components/schemas/DurationMsV3'
        nextStepId:
          $ref: '#/components/schemas/IdentifierV3'
      required:
      - id
      - kind
      - durationMs
      - nextStepId
      additionalProperties: false
    CompleteStepV3:
      type: object
      properties:
        id: *id001
        kind:
          const: COMPLETE
        scope:
          type: string
          enum:
          - BRANCH
          - ACTIVATION
        resultProfileId:
          $ref: '#/components/schemas/IdentifierV3'
      required:
      - id
      - kind
      - scope
      - resultProfileId
      additionalProperties: false
    FailStepV3:
      type: object
      properties:
        id: *id001
        kind:
          const: FAIL
        scope:
          type: string
          enum:
          - BRANCH
          - ACTIVATION
        errorProfileId:
          $ref: '#/components/schemas/IdentifierV3'
      required:
      - id
      - kind
      - scope
      - errorProfileId
      additionalProperties: false
    ExecutionStepV3:
      oneOf:
      - $ref: '#/components/schemas/ProcessStepV3'
      - $ref: '#/components/schemas/CallStepV3'
      - $ref: '#/components/schemas/PublishStepV3'
      - $ref: '#/components/schemas/ConditionStepV3'
      - $ref: '#/components/schemas/ForkStepV3'
      - $ref: '#/components/schemas/JoinStepV3'
      - $ref: '#/components/schemas/DelayStepV3'
      - $ref: '#/components/schemas/CompleteStepV3'
      - $ref: '#/components/schemas/FailStepV3'
      description: União discriminada pelo campo kind
    ExecutionPlanV3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IdentifierV3'
        operationId:
          $ref: '#/components/schemas/IdentifierV3'
        entryStepId:
          $ref: '#/components/schemas/IdentifierV3'
        limits:
          $ref: '#/components/schemas/PlanLimitsV3'
        steps:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExecutionStepV3'
      required:
      - id
      - operationId
      - entryStepId
      - limits
      - steps
      additionalProperties: false
    ArchitectureDefinitionV3:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/IdentifierV3'
        schemaVersion:
          const: '3'
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentDefinitionV3'
        resources:
          type: array
          items:
            $ref: '#/components/schemas/ResourceDefinitionV3'
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/EndpointDefinitionV3'
        operations:
          type: array
          items:
            $ref: '#/components/schemas/OperationDefinitionV3'
        relations:
          type: array
          items:
            $ref: '#/components/schemas/RelationDefinitionV3'
        executionPlans:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionPlanV3'
      required:
      - id
      - schemaVersion
      - components
      - resources
      - endpoints
      - operations
      - relations
      - executionPlans
      additionalProperties: false
    ComponentInitialStateV3:
      type: object
      properties:
        kind:
          const: COMPONENT
        componentId:
          $ref: '#/components/schemas/IdentifierV3'
        available:
          type: boolean
      required:
      - kind
      - componentId
      additionalProperties: false
    ResourceInitialStateV3:
      type: object
      properties:
        kind:
          const: RESOURCE
        resourceId:
          $ref: '#/components/schemas/IdentifierV3'
        available:
          type: boolean
      required:
      - kind
      - resourceId
      additionalProperties: false
    PolicyInitialStateV3:
      type: object
      properties:
        kind:
          const: POLICY
        policyInstanceId:
          $ref: '#/components/schemas/IdentifierV3'
        state:
          type: string
          minLength: 1
      required:
      - kind
      - policyInstanceId
      additionalProperties: false
    QueueInitialStateV3:
      type: object
      properties:
        kind:
          const: QUEUE
        queueId:
          $ref: '#/components/schemas/IdentifierV3'
        initialMessageCount:
          type: integer
          minimum: 0
      required:
      - kind
      - queueId
      additionalProperties: false
    InitialStateV3:
      oneOf:
      - $ref: '#/components/schemas/ComponentInitialStateV3'
      - $ref: '#/components/schemas/ResourceInitialStateV3'
      - $ref: '#/components/schemas/PolicyInitialStateV3'
      - $ref: '#/components/schemas/QueueInitialStateV3'
      description: União discriminada pelo campo kind
    ScenarioEntryV3:
      type: object
      properties:
        componentId:
          $ref: '#/components/schemas/IdentifierV3'
        operationId:
          $ref: '#/components/schemas/IdentifierV3'
        connectionId:
          $ref: '#/components/schemas/IdentifierV3'
        inputProfileId:
          $ref: '#/components/schemas/IdentifierV3'
      required:
      - componentId
      - operationId
      additionalProperties: false
