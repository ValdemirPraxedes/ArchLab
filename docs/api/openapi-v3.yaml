      - PRINCIPAL_TIMED_OUT
      - GLOBAL_COMPLETED
      - HORIZON_REACHED
      - LIMIT_REACHED
      - RUNTIME_STATE_DELTA
      description: Catálogo público inicial de fatos, diferente dos 32 eventos internos de agendamento. Acrescentar
        novos kinds requer revisão contratual.
    SnapshotEntityV3:
      oneOf:
      - $ref: '#/components/schemas/ActivationSnapshotV3'
      - $ref: '#/components/schemas/InteractionSnapshotV3'
      - $ref: '#/components/schemas/AttemptSnapshotV3'
      - $ref: '#/components/schemas/ParallelGroupSnapshotV3'
      - $ref: '#/components/schemas/ResourceSnapshotV3'
      - $ref: '#/components/schemas/QueueEntrySnapshotV3'
      - $ref: '#/components/schemas/PublicationSnapshotV3'
      - $ref: '#/components/schemas/DeliveryAttemptSnapshotV3'
      description: União de projeções públicas de entidade. Tipo e ID são validados contra entityKind/entityId durante
        replay.
    StateDeltaV3:
      type: object
      additionalProperties: false
      required:
      - deltaId
      - sequence
      - timestampMs
      - sourceTraceRecordId
      - entityKind
      - entityId
      - operation
      - expectedVersion
      - nextVersion
      - before
      - after
      properties:
        deltaId:
          $ref: '#/components/schemas/IdentifierV3'
        sequence:
          type: integer
          minimum: 0
        timestampMs:
          $ref: '#/components/schemas/DurationMsV3'
        sourceTraceRecordId:
          $ref: '#/components/schemas/IdentifierV3'
        entityKind:
          type: string
          enum:
          - ACTIVATION
          - INTERACTION
          - ATTEMPT
          - PARALLEL_GROUP
          - RESOURCE
          - QUEUE_ENTRY
          - PUBLICATION
          - DELIVERY_ATTEMPT
        entityId:
          $ref: '#/components/schemas/IdentifierV3'
        operation:
          type: string
          enum:
          - CREATE
          - UPDATE
          - REMOVE
        expectedVersion:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        nextVersion:
          oneOf:
          - type: integer
            minimum: 0
          - type: 'null'
        before:
          oneOf:
          - $ref: '#/components/schemas/SnapshotEntityV3'
          - type: 'null'
        after:
          oneOf:
          - $ref: '#/components/schemas/SnapshotEntityV3'
          - type: 'null'
      allOf:
      - if:
          properties:
            operation:
              const: CREATE
          required:
          - operation
        then:
          properties:
            before:
              type: 'null'
            expectedVersion:
              type: 'null'
            nextVersion:
              const: 0
            after:
              $ref: '#/components/schemas/SnapshotEntityV3'
      - if:
          properties:
            operation:
              const: UPDATE
          required:
          - operation
        then:
          properties:
            before:
              $ref: '#/components/schemas/SnapshotEntityV3'
            after:
              $ref: '#/components/schemas/SnapshotEntityV3'
            expectedVersion:
              type: integer
              minimum: 0
            nextVersion:
              type: integer
              minimum: 1
      - if:
          properties:
            operation:
              const: REMOVE
          required:
          - operation
        then:
          properties:
            before:
              $ref: '#/components/schemas/SnapshotEntityV3'
            after:
              type: 'null'
            expectedVersion:
              type: integer
              minimum: 0
            nextVersion:
              type: 'null'
      description: Contrato para projeção PUBLIC_SNAPSHOT. Validador de replay exige identidade, versão exata, nextVersion=expectedVersion+1,
        before idêntico ao estado corrente e ordem monotônica. DELETE não é permitido para entidade com dependências
        pendentes. Referência a TraceRecord é obrigatória.
    StateReconstructionV3:
      type: object
      additionalProperties: false
      required:
      - scope
      - completeness
      - deltas
      - observedUntilMs
      properties:
        scope:
          const: PUBLIC_SNAPSHOT
        completeness:
          type: string
          enum:
          - COMPLETE
          - COMPLETE_UNTIL_STOP
          - TRUNCATED
        deltas:
          type: array
          items:
            $ref: '#/components/schemas/StateDeltaV3'
        observedUntilMs:
          $ref: '#/components/schemas/DurationMsV3'
          description: Marco terminal de observação, inclusive sem mudanças de entidade nesse instante.
      description: Reconstroi somente ExecutionStateSnapshotV3 (campos públicos existentes), não o estado interno
        completo do agendador, cursores, leases, timers ou resultados. Para isso será necessário perfil FULL_RUNTIME
        futuro.
