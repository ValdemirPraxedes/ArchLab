    ResultIntegrityV3:
      type: object
      properties:
        snapshotDigest:
          type: string
          minLength: 1
        normalizedTraceDigest:
          type: string
          minLength: 1
        normalizedResultDigest:
          type: string
          minLength: 1
        digestAlgorithmVersion:
          type: string
          minLength: 1
          description: 'sha256-cjson-v1: SHA-256 sobre JSON canonizado UTF-8, sort_keys, separators sem espaços;
            digest do resultado omite integrity; digests de snapshot usam objeto finalState; trace usa records.
            IDs externos devem ser normalizados em reexecuções.'
        traceCompleteness:
          type: string
          enum:
          - COMPLETE
          - COMPLETE_UNTIL_STOP
          - TRUNCATED
        playbackReconstructible:
          type: boolean
          description: true exige histórico de estado de runtime integral, incluindo dados internos não contidos
            em ExecutionStateSnapshotV3. Um journal PUBLIC_SNAPSHOT por si só não justifica true.
        publicSnapshotReconstructible:
          type: boolean
          description: true somente se replay completo dos deltas PUBLIC_SNAPSHOT reproduz finalState; não implica
            playback integral de runtime.
        fullRuntimeSnapshotReconstructible:
          type: boolean
          description: Verdadeiro somente apos validacao integral dos deltas FULL_RUNTIME com envelopes TraceRecordV3.
            Nao prova reexecucao do motor.
      required:
      - snapshotDigest
      - normalizedTraceDigest
      - normalizedResultDigest
      - digestAlgorithmVersion
      - traceCompleteness
      - playbackReconstructible
      additionalProperties: false
    SimulationResponseV3:
      type: object
      properties:
        metadata:
          $ref: '#/components/schemas/ExecutionMetadataV3'
        principal:
          $ref: '#/components/schemas/PrincipalResultV3'
        global:
          $ref: '#/components/schemas/GlobalResultV3'
        initialState:
          $ref: '#/components/schemas/ExecutionStateSnapshotV3'
        finalState:
          $ref: '#/components/schemas/ExecutionStateSnapshotV3'
