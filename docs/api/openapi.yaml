openapi: 3.1.0
info:
  title: ArchLab Simulation API (unificada /api/v1)
  version: 0.4.0-contract-draft
  description: Contrato canônico v1 em evolução para a v0.4; simulação semântica determinística sem protocolos de rede reais.
servers:
- url: /
tags:
- name: Architectures
  description: Validação estrutural do grafo.
- name: Scenarios
  description: Validação do cenário de execução.
- name: Simulations
  description: Execução determinística e resultados completos.
paths:
  /api/v1/architectures/validate:
    post:
      tags:
      - Architectures
      operationId: validateArchitecture
      summary: Validar estrutura do grafo
      description: Valida IDs, direções, modalidades de integração, duplicidade e ciclos no grafo completo.
        Não exige cenário, não simula. HTTP 200 com valid=false para violações de domínio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Architecture'
            examples:
              sample:
                $ref: '#/components/examples/architecture'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                sample:
                  $ref: '#/components/examples/validationValid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/scenarios/validate:
    post:
      tags:
      - Scenarios
      operationId: validateScenario
      summary: Validar arquitetura e cenário selecionado
      description: Valida primeiro a arquitetura completa, depois Client e conexão inicial, dependências e
        configurações do cenário. Não executa o motor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
            examples:
              sample:
                $ref: '#/components/examples/scenario'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                sample:
                  $ref: '#/components/examples/validationValid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/simulations:
    post:
      tags:
      - Simulations
      operationId: executeSimulation
      summary: Executar cenário determinístico
      description: Revalida arquitetura e cenário, executa uma requisição principal em memória e devolve trace
        integral para playback local. Não há rede real ou persistência.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
            examples:
              sample:
                $ref: '#/components/examples/simulationRequest'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
              examples:
                sample:
                  $ref: '#/components/examples/simulationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidSimulation'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: .*\S.*
      description: ID lógico não vazio; unicidade e referências são verificadas pelo validador de domínio.
    DisplayName:
      type: string
      minLength: 1
      maxLength: 80
      pattern: .*\S.*
      description: Nome legível; limite em Unicode code points conforme JSON Schema. Remove-se espaço nas extremidades
        na validação de domínio.
    DurationMs:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000
      description: Milissegundos virtuais inteiros. Limite operacional inicial de 1 bilhão por propriedade;
        overflow da execução é rejeitado.
    Headers:
      type: object
      maxProperties: 32
      propertyNames:
        type: string
        minLength: 1
        maxLength: 128
      additionalProperties:
        type: string
        maxLength: 1024
      description: Mapa de cabeçalhos ilustrativos, não enviados na rede.
    HttpRequest:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        path:
          type: string
          maxLength: 2048
          minLength: 1
        headers:
          $ref: '#/components/schemas/Headers'
        body:
          type: string
          maxLength: 32768
      required:
      - method
      - path
      description: Dados HTTP ilustrativos; headers e body são opcionais.
    HttpResponse:
      type: object
      additionalProperties: false
      properties:
        statusCode:
          type: integer
          minimum: 100
          maximum: 599
        headers:
          $ref: '#/components/schemas/Headers'
        body:
          type: string
          maxLength: 32768
      required:
      - statusCode
      description: Código HTTP ilustrativo, sem propagação automática de falhas.
    HttpRestIntegration:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: HTTP_REST
          type: string
        request:
          $ref: '#/components/schemas/HttpRequest'
        response:
          $ref: '#/components/schemas/HttpResponse'
      required:
      - kind
      description: Integração HTTP/REST; request/response opcionais recebem modelos padrão para inspeção.
    SoapHttpIntegration:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: SOAP_HTTP
          type: string
        soapVersion:
          type: string
          const: '1.2'
        operation:
          type: string
          maxLength: 256
        action:
          type: string
          maxLength: 2048
        requestEnvelope:
          type: string
          maxLength: 32768
        responseEnvelope:
          type: string
          maxLength: 32768
        httpStatusCode:
          type: integer
          minimum: 100
          maximum: 599
        requestHeaders:
          $ref: '#/components/schemas/Headers'
        responseHeaders:
          $ref: '#/components/schemas/Headers'
      required:
      - kind
      - soapVersion
      description: SOAP 1.2 sobre HTTP; envelopes opcionais são ilustrativos, não executados. XML fornecido
        deve ser bem-formado, sem entidades externas; sem WSDL/XSD.
    DatabaseQueryIntegration:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: DATABASE_QUERY
        queryText:
          type: string
          maxLength: 32768
        responseText:
          type: string
          maxLength: 32768
      required:
      - kind
      description: Consulta ilustrativa, sem execução de SQL e sem banco real.
    HttpGenericIntegration:
      type: object
      additionalProperties: false
      required: [kind, method, path]
      properties:
        kind: {type: string, const: HTTP_GENERIC}
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]}
        path: {type: string, minLength: 1, maxLength: 2048}
    GraphqlHttpIntegration:
      type: object
      additionalProperties: false
      required: [kind, operationType, operationName]
      properties:
        kind: {type: string, const: GRAPHQL_HTTP}
        operationType: {type: string, enum: [QUERY, MUTATION]}
        operationName: {type: string, minLength: 1, maxLength: 256}
    GrpcUnaryIntegration:
      type: object
      additionalProperties: false
      required: [kind, service, method]
      properties:
        kind: {type: string, const: GRPC_UNARY}
        service: {type: string, minLength: 1, maxLength: 256}
        method: {type: string, minLength: 1, maxLength: 256}
    CoapIntegration:
      type: object
      additionalProperties: false
      required: [kind, method, resource]
      properties:
        kind: {type: string, const: COAP}
        method: {type: string, enum: [GET, POST, PUT, DELETE]}
        resource: {type: string, minLength: 1, maxLength: 2048}
        mode: {type: string, enum: [CON, NON], default: CON}
    WebSocketMessage:
      type: object
      additionalProperties: false
      required: [sender, intervalMs]
      properties:
        sender: {type: string, enum: [SOURCE, TARGET]}
        intervalMs: {type: integer, format: int64, minimum: 0, default: 0}
        payload: {type: string, maxLength: 32768}
    WebSocketIntegration:
      type: object
      additionalProperties: false
      required: [kind, path]
      properties:
        kind: {type: string, const: WEBSOCKET}
        path: {type: string, minLength: 1, maxLength: 2048}
        connectTimeoutMs: {type: integer, format: int64, minimum: 0, default: 5000}
        idleTimeoutMs: {type: [integer, 'null'], format: int64, minimum: 0, default: null}
        closeMode: {type: string, enum: [AUTOMATIC, EXPLICIT], default: AUTOMATIC}
        messages:
          type: array
          maxItems: 100
          default: []
          items: {$ref: '#/components/schemas/WebSocketMessage'}
    MqttIntegration:
      type: object
      additionalProperties: false
      required: [kind, topic]
      properties:
        kind: {type: string, const: MQTT}
        topic: {type: string, minLength: 1, maxLength: 256, pattern: '^[^+#]+      oneOf:
      - $ref: '#/components/schemas/HttpRestIntegration'
      - $ref: '#/components/schemas/SoapHttpIntegration'
      - $ref: '#/components/schemas/DatabaseQueryIntegration'
      discriminator:
        propertyName: kind
        mapping:
          HTTP_REST: '#/components/schemas/HttpRestIntegration'
          SOAP_HTTP: '#/components/schemas/SoapHttpIntegration'
          DATABASE_QUERY: '#/components/schemas/DatabaseQueryIntegration'
    QueueIntegration:
      type: object
      additionalProperties: false
      required: [kind, queueName]
      properties:
        kind: {type: string, const: QUEUE}
        queueName: {type: string, minLength: 1, maxLength: 256}
    TopicIntegration:
      type: object
      additionalProperties: false
      required: [kind, topic]
      properties:
        kind: {type: string, const: TOPIC}
        topic: {type: string, minLength: 1, maxLength: 256}
    Integration:
      oneOf:
      - $ref: '#/components/schemas/HttpRestIntegration'
      - $ref: '#/components/schemas/SoapHttpIntegration'
      - $ref: '#/components/schemas/DatabaseQueryIntegration'
      - $ref: '#/components/schemas/HttpGenericIntegration'
      - $ref: '#/components/schemas/GraphqlHttpIntegration'
      - $ref: '#/components/schemas/GrpcUnaryIntegration'
      - $ref: '#/components/schemas/CoapIntegration'
      - $ref: '#/components/schemas/WebSocketIntegration'
      - $ref: '#/components/schemas/MqttIntegration'
      - $ref: '#/components/schemas/QueueIntegration'
      - $ref: '#/components/schemas/TopicIntegration'
      discriminator:
        propertyName: kind
        mapping:
          HTTP_REST: '#/components/schemas/HttpRestIntegration'
          SOAP_HTTP: '#/components/schemas/SoapHttpIntegration'
          DATABASE_QUERY: '#/components/schemas/DatabaseQueryIntegration'
          HTTP_GENERIC: '#/components/schemas/HttpGenericIntegration'
          GRAPHQL_HTTP: '#/components/schemas/GraphqlHttpIntegration'
          GRPC_UNARY: '#/components/schemas/GrpcUnaryIntegration'
          COAP: '#/components/schemas/CoapIntegration'
          WEBSOCKET: '#/components/schemas/WebSocketIntegration'
          MQTT: '#/components/schemas/MqttIntegration'
          QUEUE: '#/components/schemas/QueueIntegration'
          TOPIC: '#/components/schemas/TopicIntegration'
    Client:
      type: object
      additionalProperties: false
      properties:
        id: &id001
          $ref: '#/components/schemas/Identifier'
        displayName: &id002
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: CLIENT
      required:
      - id
      - type
      - displayName
    WEB_BROWSERClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: WEB_BROWSER
      required:
      - id
      - type
      - displayName
    MOBILE_APPClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: MOBILE_APP
      required:
      - id
      - type
      - displayName
    DESKTOP_APPClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: DESKTOP_APP
      required:
      - id
      - type
      - displayName
    CLIClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: CLI
      required:
      - id
      - type
      - displayName
    BOTClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: BOT
      required:
      - id
      - type
      - displayName
    EMBEDDED_SYSTEMClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: EMBEDDED_SYSTEM
      required:
      - id
      - type
      - displayName
    Api:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        displayName: *id002
        type:
          type: string
          const: API
        preProcessingMs:
          allOf:
          - $ref: '#/components/schemas/DurationMs'
          default: 0
        postProcessingMs:
          allOf:
          - $ref: '#/components/schemas/DurationMs'
          default: 0
      required:
      - id
      - type
      - displayName
    Database:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        displayName: *id002
        type:
          type: string
          const: DATABASE
        processingMs:
          $ref: '#/components/schemas/DurationMs'
      required:
      - id
      - type
      - displayName
      - processingMs
    Broker:
      type: object
      additionalProperties: false
      required: [id, type, displayName]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: BROKER
        destinations:
          type: array
          maxItems: 3000
          default: []
          items:
            $ref: '#/components/schemas/BrokerDestination'
        subscriptions:
          type: array
          maxItems: 3000
          default: []
          items:
            $ref: '#/components/schemas/BrokerSubscription'
    BrokerDestination:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          enum: [QUEUE, TOPIC, MQTT]
    BrokerSubscription:
      type: object
      additionalProperties: false
      required: [destinationName, consumerComponentId, connectionId]
      properties:
        destinationName:
          type: string
          minLength: 1
          maxLength: 256
        consumerComponentId:
          $ref: '#/components/schemas/Identifier'
        connectionId:
          $ref: '#/components/schemas/Identifier'
    Component:
      oneOf:
      - $ref: '#/components/schemas/Client'
      - $ref: '#/components/schemas/WEB_BROWSERClient'
      - $ref: '#/components/schemas/MOBILE_APPClient'
      - $ref: '#/components/schemas/DESKTOP_APPClient'
      - $ref: '#/components/schemas/CLIClient'
      - $ref: '#/components/schemas/BOTClient'
      - $ref: '#/components/schemas/EMBEDDED_SYSTEMClient'
      - $ref: '#/components/schemas/Api'
      - $ref: '#/components/schemas/Database'
      - $ref: '#/components/schemas/Broker'
      discriminator:
        propertyName: type
        mapping:
          CLIENT: '#/components/schemas/Client'
          WEB_BROWSER: '#/components/schemas/WEB_BROWSERClient'
          MOBILE_APP: '#/components/schemas/MOBILE_APPClient'
          DESKTOP_APP: '#/components/schemas/DESKTOP_APPClient'
          CLI: '#/components/schemas/CLIClient'
          BOT: '#/components/schemas/BOTClient'
          EMBEDDED_SYSTEM: '#/components/schemas/EMBEDDED_SYSTEMClient'
          API: '#/components/schemas/Api'
          DATABASE: '#/components/schemas/Database'
          BROKER: '#/components/schemas/Broker'
    ApiProcessingOverride:
      type: object
      additionalProperties: false
      description: Tempos efetivos de pré e pós-processamento da API de destino quando ativada por esta conexão de entrada. Ambos obrigatórios; não permitido em API→Database. A regra de compatibilidade de arestas é validada pelo domínio.
      properties:
        preProcessingMs:
          $ref: '#/components/schemas/DurationMs'
        postProcessingMs:
          $ref: '#/components/schemas/DurationMs'
      required:
      - preProcessingMs
      - postProcessingMs
    Connection:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        sourceId:
          $ref: '#/components/schemas/Identifier'
        targetId:
          $ref: '#/components/schemas/Identifier'
        latencyMs:
          allOf:
          - $ref: '#/components/schemas/DurationMs'
          default: 0
        integration:
          $ref: '#/components/schemas/Integration'
        apiProcessingOverride:
          $ref: '#/components/schemas/ApiProcessingOverride'
          description: Substitui os tempos padrão da API destinatária, somente em conexões Client→API ou API→API; ausente preserva padrões de Api.
      required:
      - id
      - sourceId
      - targetId
      - integration
      description: Conexão lógica dirigida; resposta percorre a conexão em sentido inverso. Unicidade por par
        não ordenado de componentes. apiProcessingOverride é opcional, aplicável só à API de destino em Client→API ou API→API;
        se ausente, prevalecem os valores de Api (padrão 0 ms para propriedades omitidas). DATABASE_QUERY não aceita override.
    Architecture:
      type: object
      additionalProperties: false
      properties:
        components:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Component'
        connections:
          type: array
          maxItems: 3000
          items:
            $ref: '#/components/schemas/Connection'
      required:
      - components
      - connections
      description: Candidata à validação, podendo estar incompleta. Regras de topologia/ciclo aplicadas no
        domínio.
    ApiExecution:
      type: object
      additionalProperties: false
      properties:
        componentId:
          $ref: '#/components/schemas/Identifier'
        dependencyConnectionId:
          $ref: '#/components/schemas/Identifier'
      required:
      - componentId
      - dependencyConnectionId
      description: Só listar APIs que efetivamente chamam uma dependência; APIs omitidas respondem diretamente.
    Scenario:
      oneOf:
      - $ref: '#/components/schemas/RequestResponseScenario'
      - $ref: '#/components/schemas/WebSocketScenario'
      - $ref: '#/components/schemas/MessagePublishScenario'
      discriminator:
        propertyName: kind
        mapping:
          REQUEST_RESPONSE: '#/components/schemas/RequestResponseScenario'
          WEBSOCKET_SESSION: '#/components/schemas/WebSocketScenario'
          MESSAGE_PUBLISH: '#/components/schemas/MessagePublishScenario'
    RequestResponseScenario:
      type: object
      additionalProperties: false
      properties:
        kind: {type: string, const: REQUEST_RESPONSE}
        entryComponentId:
          $ref: '#/components/schemas/Identifier'
        entryConnectionId:
          $ref: '#/components/schemas/Identifier'
        apiExecutions:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ApiExecution'
      required:
      - kind
      - entryComponentId
      - entryConnectionId
      - apiExecutions
      description: Uma requisição raiz, Client e conexão inicial explícitos, e zero ou uma dependência por
        API.
    WebSocketScenario:
      type: object
      additionalProperties: false
      required: [kind, entryComponentId, entryConnectionId]
      properties:
        kind: {type: string, const: WEBSOCKET_SESSION}
        entryComponentId: {$ref: '#/components/schemas/Identifier'}
        entryConnectionId: {$ref: '#/components/schemas/Identifier'}
    MessagePublishScenario:
      type: object
      additionalProperties: false
      required: [kind, entryComponentId, entryConnectionId, destinationName]
      properties:
        kind: {type: string, const: MESSAGE_PUBLISH}
        entryComponentId: {$ref: '#/components/schemas/Identifier'}
        entryConnectionId: {$ref: '#/components/schemas/Identifier'}
        destinationName: {type: string, minLength: 1, maxLength: 256}
        publishCount: {type: integer, minimum: 1, maximum: 100, default: 1}
    SimulationRequest:
      type: object
      additionalProperties: false
      properties:
        architecture:
          $ref: '#/components/schemas/Architecture'
        scenario:
          $ref: '#/components/schemas/Scenario'
      required:
      - architecture
      - scenario
    Violation:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - DUPLICATE_COMPONENT_ID
          - DUPLICATE_CONNECTION_ID
          - DUPLICATE_CONNECTION
          - INVALID_CONNECTION
          - UNKNOWN_COMPONENT
          - INVALID_DURATION
          - CYCLIC_DEPENDENCY
          - INVALID_ENTRY_COMPONENT
          - INVALID_ENTRY_CONNECTION
          - INVALID_SCENARIO_DEPENDENCY
          - DUPLICATE_API_EXECUTION
          - INVALID_INTEGRATION
          - INVALID_MESSAGE_TEMPLATE
          - INVALID_DISPLAY_NAME
          - INVALID_IDENTIFIER
          - INVALID_TOPOLOGY
          - EXCESSIVE_EXECUTION_DURATION
        path:
          type: string
          maxLength: 2048
          minLength: 1
        message:
          type: string
          maxLength: 2048
          minLength: 1
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - path
      - message
      description: Códigos estáveis para validações estruturais, de cenário e de representação.
    ValidationResponse:
      type: object
      additionalProperties: false
      properties:
        valid:
          type: boolean
        violations:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Violation'
      required:
      - valid
      - violations
    Problem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 256
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2048
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          maxLength: 128
          minLength: 1
      required:
      - type
      - title
      - status
      - code
      description: RFC 9457 com extensão code.
    InvalidSimulationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        additionalProperties: true
        properties:
          violations:
            type: array
            maxItems: 5000
            items:
              $ref: '#/components/schemas/Violation'
        required:
        - violations
    ComponentStatus:
      type: string
      enum:
      - IDLE
      - PROCESSING
      - WAITING
      - COMPLETED
    RequestStatus:
      type: string
      enum:
      - CREATED
      - IN_PROGRESS
      - WAITING_DEPENDENCY
      - COMPLETED
    ExchangeStatus:
      type: string
      enum:
      - CREATED
      - WAITING_RESPONSE
      - COMPLETED
    InitialState:
      type: object
      additionalProperties: false
      properties:
        components:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentStatus'
        requests:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RequestStatus'
        exchanges:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExchangeStatus'
      required:
      - components
      - requests
      - exchanges
    ExecutionInfo:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum: [COMPLETED, FAILED, TIMED_OUT, COMPLETED_WITH_ERRORS]
        mainStatus:
          type: string
          enum: [COMPLETED, FAILED, TIMED_OUT]
          description: Resultado terminal da operação principal, independente da conclusão global.
        requestId:
          $ref: '#/components/schemas/Identifier'
        entryComponentId:
          $ref: '#/components/schemas/Identifier'
        entryConnectionId:
          $ref: '#/components/schemas/Identifier'
        totalDurationMs:
          allOf:
          - $ref: '#/components/schemas/DurationMs'
          maximum: 3600000
      required:
      - id
      - status
      - mainStatus
      - requestId
      - entryComponentId
      - entryConnectionId
      - totalDurationMs
    StateTransitionTrace:
      type: object
      additionalProperties: false
      properties:
        sequence: &id003
          type: integer
          format: int64
          minimum: 1
        timestampMs: &id004
          $ref: '#/components/schemas/DurationMs'
        type:
          type: string
          const: STATE_TRANSITION
        entityKind:
          type: string
          enum:
          - COMPONENT
          - REQUEST
          - EXCHANGE
        entityId:
          $ref: '#/components/schemas/Identifier'
        previousState:
          type:
          - string
          - 'null'
        newState:
          type: string
          maxLength: 128
          minLength: 1
        cause:
          type: string
          maxLength: 128
          minLength: 1
      required:
      - sequence
      - timestampMs
      - type
      - entityKind
      - entityId
      - previousState
      - newState
      - cause
    MessageTrace:
      type: object
      additionalProperties: false
      properties:
        sequence: *id003
        timestampMs: *id004
        type:
          type: string
          const: MESSAGE_EVENT
        action:
          type: string
          enum:
          - SENT
          - ARRIVED
        messageId:
          $ref: '#/components/schemas/Identifier'
        requestId:
          $ref: '#/components/schemas/Identifier'
        exchangeId:
          $ref: '#/components/schemas/Identifier'
        parentExchangeId:
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        connectionId:
          $ref: '#/components/schemas/Identifier'
        sourceId:
          $ref: '#/components/schemas/Identifier'
        targetId:
          $ref: '#/components/schemas/Identifier'
        direction:
          type: string
          enum:
          - REQUEST
          - RESPONSE
        intent:
          type: string
          enum:
          - API_REQUEST
          - DATABASE_QUERY
      required:
      - sequence
      - timestampMs
      - type
      - action
      - messageId
      - requestId
      - exchangeId
      - parentExchangeId
      - connectionId
      - sourceId
      - targetId
      - direction
      - intent
    ProcessingTrace:
      type: object
      additionalProperties: false
      properties:
        sequence: *id003
        timestampMs: *id004
        type:
          type: string
          const: PROCESSING_EVENT
        action:
          type: string
          enum:
          - STARTED
          - COMPLETED
        componentId:
          $ref: '#/components/schemas/Identifier'
        requestId:
          $ref: '#/components/schemas/Identifier'
        phase:
          type: string
          enum:
          - API_PRE_PROCESSING
          - API_POST_PROCESSING
          - DATABASE_PROCESSING
      required:
      - sequence
      - timestampMs
      - type
      - action
      - componentId
      - requestId
      - phase
    TraceEntry:
      oneOf:
      - $ref: '#/components/schemas/StateTransitionTrace'
      - $ref: '#/components/schemas/MessageTrace'
      - $ref: '#/components/schemas/ProcessingTrace'
      discriminator:
        propertyName: type
        mapping:
          STATE_TRANSITION: '#/components/schemas/StateTransitionTrace'
          MESSAGE_EVENT: '#/components/schemas/MessageTrace'
          PROCESSING_EVENT: '#/components/schemas/ProcessingTrace'
    CommunicationActivity:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        kind:
          type: string
          const: COMMUNICATION
        messageId:
          $ref: '#/components/schemas/Identifier'
        exchangeId:
          $ref: '#/components/schemas/Identifier'
        connectionId:
          $ref: '#/components/schemas/Identifier'
        sourceId:
          $ref: '#/components/schemas/Identifier'
        targetId:
          $ref: '#/components/schemas/Identifier'
        startMs: &id005
          $ref: '#/components/schemas/DurationMs'
        endMs: &id006
          $ref: '#/components/schemas/DurationMs'
        durationMs: &id007
          $ref: '#/components/schemas/DurationMs'
      required:
      - id
      - kind
      - messageId
      - exchangeId
      - connectionId
      - sourceId
      - targetId
      - startMs
      - endMs
      - durationMs
    ProcessingActivity:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        kind:
          type: string
          const: PROCESSING
        componentId:
          $ref: '#/components/schemas/Identifier'
        requestId:
          $ref: '#/components/schemas/Identifier'
        phase:
          type: string
          enum:
          - API_PRE_PROCESSING
          - API_POST_PROCESSING
          - DATABASE_PROCESSING
