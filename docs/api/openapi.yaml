          $ref: '#/components/schemas/Identifier'
        calleeComponentId:
          $ref: '#/components/schemas/Identifier'
        connectionId:
          $ref: '#/components/schemas/Identifier'
        startMs:
          $ref: '#/components/schemas/DurationMs'
        endMs:
          $ref: '#/components/schemas/DurationMs'
