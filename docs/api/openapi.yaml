openapi: 3.1.0
info:
  title: ArchLab Simulation API
  version: 0.1.0
  description: Contrato preliminar para revisão. Simulação determinística de uma requisição Client → API →
    Database → API → Client, sem rede real nem persistência.
servers:
- url: /
tags:
- name: Architectures
  description: Validação estrutural e de domínio.
- name: Simulations
  description: Execução síncrona e cálculo de resultados.
paths:
  /api/v1/architectures/validate:
    post:
      tags:
      - Architectures
      operationId: validateArchitecture
      summary: Validar uma arquitetura sem iniciar simulação
      description: Um diagrama sintaticamente válido, porém incompatível com as regras do MVP, retorna 200
        com valid=false e violações. Isso é resultado normal da validação.
      requestBody:
        $ref: '#/components/requestBodies/ArchitectureBody'
      responses:
        '200':
          description: Resultado da validação de domínio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                valid:
                  summary: Arquitetura válida
                  value:
                    valid: true
                    violations: []
                invalid:
                  summary: Arquitetura sem Database
                  value:
                    valid: false
                    violations:
                    - code: MISSING_COMPONENT
                      path: components
                      message: É necessário adicionar um Database.
                      details:
                        componentType: DATABASE
                        expected: 1
                        actual: 0
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/simulations:
    post:
      tags:
      - Simulations
      operationId: executeSimulation
      summary: Validar e simular arquitetura
      description: Revalida sempre a arquitetura, calcula a execução em memória e devolve resultado integral.
        Não cria recurso persistente nem disponibiliza controle remoto de reprodução. Erro interno do motor
        não é falha simulada.
      requestBody:
        $ref: '#/components/requestBodies/ArchitectureBody'
      responses:
        '200':
          description: Simulação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
              examples:
                complete260ms:
                  summary: Execução completa de 260 ms (7 atividades; trace integral)
                  value:
                    execution:
                      id: exec-001
                      status: COMPLETED
                      totalDurationMs: 260
                    initialState:
                      components:
                        client-1: IDLE
                        api-1: IDLE
                        db-1: IDLE
                      requests:
                        req-001: CREATED
                      exchanges: {}
                    trace:
                    - sequence: 1
                      timestampMs: 0
                      type: STATE_TRANSITION
                      entityKind: REQUEST
                      entityId: req-001
                      previousState: CREATED
                      newState: IN_PROGRESS
                      cause: REQUEST_STARTED
                    - sequence: 2
                      timestampMs: 0
                      type: STATE_TRANSITION
                      entityKind: EXCHANGE
                      entityId: exchange-api-1
                      previousState: null
                      newState: CREATED
                      cause: EXCHANGE_CREATED
                    - sequence: 3
                      timestampMs: 0
                      type: STATE_TRANSITION
                      entityKind: EXCHANGE
                      entityId: exchange-api-1
                      previousState: CREATED
                      newState: WAITING_RESPONSE
                      cause: REQUEST_SENT
                    - sequence: 4
                      timestampMs: 0
                      type: MESSAGE_EVENT
                      action: SENT
                      messageId: msg-001
                      requestId: req-001
                      exchangeId: exchange-api-1
                      connectionId: connection-1
                      sourceId: client-1
                      targetId: api-1
                      direction: REQUEST
                      intent: API_REQUEST
                    - sequence: 5
                      timestampMs: 0
                      type: STATE_TRANSITION
                      entityKind: COMPONENT
                      entityId: client-1
                      previousState: IDLE
                      newState: WAITING
                      cause: API_REQUEST_SENT
                    - sequence: 6
                      timestampMs: 20
                      type: MESSAGE_EVENT
                      action: ARRIVED
                      messageId: msg-001
                      requestId: req-001
                      exchangeId: exchange-api-1
                      connectionId: connection-1
                      sourceId: client-1
                      targetId: api-1
                      direction: REQUEST
                      intent: API_REQUEST
                    - sequence: 7
                      timestampMs: 20
                      type: STATE_TRANSITION
                      entityKind: COMPONENT
                      entityId: api-1
                      previousState: IDLE
                      newState: PROCESSING
                      cause: API_REQUEST_RECEIVED
                    - sequence: 8
                      timestampMs: 20
                      type: PROCESSING_EVENT
                      action: STARTED
                      componentId: api-1
                      requestId: req-001
                      phase: API_PRE_PROCESSING
                    - sequence: 9
                      timestampMs: 50
                      type: PROCESSING_EVENT
                      action: COMPLETED
                      componentId: api-1
                      requestId: req-001
                      phase: API_PRE_PROCESSING
                    - sequence: 10
                      timestampMs: 50
                      type: STATE_TRANSITION
                      entityKind: COMPONENT
                      entityId: api-1
                      previousState: PROCESSING
                      newState: WAITING
                      cause: DATABASE_QUERY_SENT
                    - sequence: 11
                      timestampMs: 50
                      type: STATE_TRANSITION
                      entityKind: REQUEST
                      entityId: req-001
                      previousState: IN_PROGRESS
                      newState: WAITING_DEPENDENCY
                      cause: DATABASE_QUERY_SENT
                    - sequence: 12
                      timestampMs: 50
                      type: STATE_TRANSITION
                      entityKind: EXCHANGE
                      entityId: exchange-db-1
                      previousState: null
                      newState: CREATED
                      cause: EXCHANGE_CREATED
                    - sequence: 13
                      timestampMs: 50
                      type: STATE_TRANSITION
                      entityKind: EXCHANGE
                      entityId: exchange-db-1
                      previousState: CREATED
                      newState: WAITING_RESPONSE
                      cause: REQUEST_SENT
                    - sequence: 14
                      timestampMs: 50
                      type: MESSAGE_EVENT
                      action: SENT
                      messageId: msg-002
                      requestId: req-001
                      exchangeId: exchange-db-1
                      connectionId: connection-2
                      sourceId: api-1
                      targetId: db-1
                      direction: REQUEST
                      intent: DATABASE_QUERY
                    - sequence: 15
                      timestampMs: 60
                      type: MESSAGE_EVENT
                      action: ARRIVED
                      messageId: msg-002
                      requestId: req-001
                      exchangeId: exchange-db-1
                      connectionId: connection-2
                      sourceId: api-1
                      targetId: db-1
                      direction: REQUEST
                      intent: DATABASE_QUERY
                    - sequence: 16
                      timestampMs: 60
                      type: STATE_TRANSITION
                      entityKind: COMPONENT
                      entityId: db-1
                      previousState: IDLE
                      newState: PROCESSING
                      cause: DATABASE_QUERY_RECEIVED
                    - sequence: 17
                      timestampMs: 60
                      type: PROCESSING_EVENT
                      action: STARTED
                      componentId: db-1
                      requestId: req-001
                      phase: DATABASE_PROCESSING
                    - sequence: 18
                      timestampMs: 210
                      type: PROCESSING_EVENT
                      action: COMPLETED
                      componentId: db-1
                      requestId: req-001
                      phase: DATABASE_PROCESSING
                    - sequence: 19
                      timestampMs: 210
                      type: STATE_TRANSITION
                      entityKind: COMPONENT
                      entityId: db-1
                      previousState: PROCESSING
                      newState: COMPLETED
                      cause: DATABASE_PROCESSING_COMPLETED
                    - sequence: 20
                      timestampMs: 210
                      type: MESSAGE_EVENT
                      action: SENT
                      messageId: msg-003
                      requestId: req-001
                      exchangeId: exchange-db-1
                      connectionId: connection-2
                      sourceId: db-1
                      targetId: api-1
                      direction: RESPONSE
                      intent: DATABASE_QUERY
                    - sequence: 21
                      timestampMs: 220
                      type: MESSAGE_EVENT
                      action: ARRIVED
                      messageId: msg-003
                      requestId: req-001
                      exchangeId: exchange-db-1
                      connectionId: connection-2
                      sourceId: db-1
                      targetId: api-1
                      direction: RESPONSE
                      intent: DATABASE_QUERY
                    - sequence: 22
                      timestampMs: 220
                      type: STATE_TRANSITION
                      entityKind: EXCHANGE
                      entityId: exchange-db-1
                      previousState: WAITING_RESPONSE
                      newState: COMPLETED
                      cause: DATABASE_RESPONSE_RECEIVED
                    - sequence: 23
                      timestampMs: 220
                      type: STATE_TRANSITION
                      entityKind: REQUEST
                      entityId: req-001
                      previousState: WAITING_DEPENDENCY
                      newState: IN_PROGRESS
                      cause: DATABASE_RESPONSE_RECEIVED
                    - sequence: 24
                      timestampMs: 220
                      type: STATE_TRANSITION
                      entityKind: COMPONENT
                      entityId: api-1
                      previousState: WAITING
                      newState: PROCESSING
                      cause: DATABASE_RESPONSE_RECEIVED
                    - sequence: 25
                      timestampMs: 220
                      type: PROCESSING_EVENT
                      action: STARTED
                      componentId: api-1
                      requestId: req-001
                      phase: API_POST_PROCESSING
                    - sequence: 26
                      timestampMs: 240
                      type: PROCESSING_EVENT
                      action: COMPLETED
                      componentId: api-1
                      requestId: req-001
                      phase: API_POST_PROCESSING
                    - sequence: 27
                      timestampMs: 240
                      type: STATE_TRANSITION
                      entityKind: COMPONENT
                      entityId: api-1
                      previousState: PROCESSING
                      newState: COMPLETED
                      cause: API_POST_PROCESSING_COMPLETED
                    - sequence: 28
                      timestampMs: 240
                      type: MESSAGE_EVENT
                      action: SENT
                      messageId: msg-004
                      requestId: req-001
                      exchangeId: exchange-api-1
                      connectionId: connection-1
                      sourceId: api-1
                      targetId: client-1
                      direction: RESPONSE
                      intent: API_REQUEST
                    - sequence: 29
                      timestampMs: 260
                      type: MESSAGE_EVENT
                      action: ARRIVED
                      messageId: msg-004
                      requestId: req-001
                      exchangeId: exchange-api-1
                      connectionId: connection-1
                      sourceId: api-1
                      targetId: client-1
                      direction: RESPONSE
                      intent: API_REQUEST
                    - sequence: 30
                      timestampMs: 260
                      type: STATE_TRANSITION
                      entityKind: EXCHANGE
                      entityId: exchange-api-1
                      previousState: WAITING_RESPONSE
                      newState: COMPLETED
                      cause: API_RESPONSE_RECEIVED
                    - sequence: 31
                      timestampMs: 260
                      type: STATE_TRANSITION
                      entityKind: COMPONENT
                      entityId: client-1
                      previousState: WAITING
                      newState: COMPLETED
                      cause: API_RESPONSE_RECEIVED
                    - sequence: 32
                      timestampMs: 260
                      type: STATE_TRANSITION
                      entityKind: REQUEST
                      entityId: req-001
                      previousState: IN_PROGRESS
                      newState: COMPLETED
                      cause: API_RESPONSE_RECEIVED
                    timeline:
                    - id: activity-1
                      kind: COMMUNICATION
                      messageId: msg-001
                      connectionId: connection-1
                      sourceId: client-1
                      targetId: api-1
                      startMs: 0
                      endMs: 20
                      durationMs: 20
                    - id: activity-2
                      kind: PROCESSING
                      componentId: api-1
                      requestId: req-001
                      phase: API_PRE_PROCESSING
                      startMs: 20
                      endMs: 50
                      durationMs: 30
                    - id: activity-3
                      kind: COMMUNICATION
                      messageId: msg-002
                      connectionId: connection-2
                      sourceId: api-1
                      targetId: db-1
                      startMs: 50
                      endMs: 60
                      durationMs: 10
                    - id: activity-4
                      kind: PROCESSING
                      componentId: db-1
                      requestId: req-001
                      phase: DATABASE_PROCESSING
                      startMs: 60
                      endMs: 210
                      durationMs: 150
                    - id: activity-5
                      kind: COMMUNICATION
                      messageId: msg-003
                      connectionId: connection-2
                      sourceId: db-1
                      targetId: api-1
                      startMs: 210
                      endMs: 220
                      durationMs: 10
                    - id: activity-6
                      kind: PROCESSING
                      componentId: api-1
                      requestId: req-001
                      phase: API_POST_PROCESSING
                      startMs: 220
                      endMs: 240
                      durationMs: 20
                    - id: activity-7
                      kind: COMMUNICATION
                      messageId: msg-004
                      connectionId: connection-1
                      sourceId: api-1
                      targetId: client-1
                      startMs: 240
                      endMs: 260
                      durationMs: 20
                    metrics:
                      apiPreProcessingMs: 30
                      apiPostProcessingMs: 20
                      databaseProcessingMs: 150
                      communicationMs: 60
                      apiWaitingMs: 170
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          description: Arquitetura bem formada mas inválida para simular.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ArchitectureProblem'
              example:
                type: /problems/invalid-architecture
                title: Arquitetura inválida
                status: 422
                detail: A arquitetura não atende aos requisitos da simulação.
                instance: /api/v1/simulations
                code: ARCHITECTURE_INVALID
                violations:
                - code: MISSING_COMPONENT
                  path: components
                  message: É necessário adicionar um Database.
        '500':
          $ref: '#/components/responses/InternalError'
components:
  requestBodies:
    ArchitectureBody:
      description: Snapshot da arquitetura candidata, sem coordenadas visuais.
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ArchitectureRequest'
          example:
            components:
            - id: client-1
              type: CLIENT
            - id: api-1
              type: API
              preProcessingMs: 30
              postProcessingMs: 20
            - id: db-1
              type: DATABASE
              processingMs: 150
            connections:
            - id: connection-1
              sourceId: client-1
              targetId: api-1
              protocol: REST
              latencyMs: 20
            - id: connection-2
              sourceId: api-1
              targetId: db-1
              protocol: TCP
              latencyMs: 10
  responses:
    BadRequest:
      description: Corpo JSON ausente, malformado ou incompatível com tipos de entrada.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/invalid-request
            title: Requisição inválida
            status: 400
            detail: Não foi possível interpretar os dados enviados.
            code: INVALID_REQUEST
    ContentTooLarge:
      description: Corpo excede o limite de tamanho configurado no servidor.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Tipo de mídia diferente de application/json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Falha técnica inesperada, sem detalhes internos expostos.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: /problems/internal-error
            title: Erro interno
            status: 500
            detail: A operação não pôde ser concluída.
            code: INTERNAL_ERROR
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: .*\S.*
      description: Identificador lógico, único no escopo correspondente.
    DurationMs:
      type: integer
      format: int64
      minimum: 0
      description: Milissegundos inteiros não negativos; máximo operacional a definir.
    ArchitectureRequest:
      type: object
      additionalProperties: false
      required:
      - components
      - connections
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentRequest'
        connections:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionRequest'
      description: O schema permite arquiteturas incompletas para o endpoint de validação; multiplicidade,
        IDs exclusivos e topologia são verificados pelo core.
    ComponentRequest:
      oneOf:
      - $ref: '#/components/schemas/ClientRequest'
      - $ref: '#/components/schemas/ApiRequest'
      - $ref: '#/components/schemas/DatabaseRequest'
      discriminator:
        propertyName: type
        mapping:
          CLIENT: '#/components/schemas/ClientRequest'
          API: '#/components/schemas/ApiRequest'
          DATABASE: '#/components/schemas/DatabaseRequest'
    ClientRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        type:
          type: string
          const: CLIENT
    ApiRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - preProcessingMs
      - postProcessingMs
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        type:
          type: string
          const: API
        preProcessingMs:
          $ref: '#/components/schemas/DurationMs'
        postProcessingMs:
          $ref: '#/components/schemas/DurationMs'
    DatabaseRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - type
      - processingMs
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        type:
          type: string
          const: DATABASE
        processingMs:
          $ref: '#/components/schemas/DurationMs'
    ConnectionRequest:
      type: object
      additionalProperties: false
      required:
      - id
      - sourceId
      - targetId
      - protocol
      - latencyMs
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        sourceId:
          $ref: '#/components/schemas/Identifier'
        targetId:
          $ref: '#/components/schemas/Identifier'
        protocol:
          type: string
          enum:
          - REST
          - SOAP
          - TCP
        latencyMs:
          $ref: '#/components/schemas/DurationMs'
    ValidationResponse:
      type: object
      additionalProperties: false
      required:
      - valid
      - violations
      properties:
        valid:
          type: boolean
        violations:
          type: array
          items:
            $ref: '#/components/schemas/Violation'
    Violation:
      type: object
      additionalProperties: false
      required:
      - code
      - path
      - message
      properties:
        code:
          type: string
          enum:
          - MISSING_COMPONENT
          - INVALID_COMPONENT_COUNT
          - DUPLICATE_COMPONENT_ID
          - DUPLICATE_CONNECTION_ID
          - INVALID_CONNECTION
          - DUPLICATE_CONNECTION
          - MISSING_CONNECTION
          - INVALID_PROTOCOL
          - INVALID_DURATION
          - UNKNOWN_COMPONENT
        path:
          type: string
          description: Caminho lógico da ocorrência no documento JSON.
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: Dados extras variáveis por violação, sujeitos a revisão.
    Problem:
      type: object
      description: RFC 9457 Problem Details com extensão code.
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
      additionalProperties: true
    ArchitectureProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        required:
        - violations
        properties:
          violations:
            type: array
            items:
              $ref: '#/components/schemas/Violation'
    SimulationResponse:
      type: object
      additionalProperties: false
      required:
      - execution
      - initialState
      - trace
      - timeline
      - metrics
      properties:
        execution:
          $ref: '#/components/schemas/ExecutionInfo'
        initialState:
          $ref: '#/components/schemas/InitialState'
        trace:
          type: array
          items:
            $ref: '#/components/schemas/TraceEntry'
          description: Ordenação ascendente (timestampMs, sequence); sequence único por execução.
        timeline:
          type: array
          items:
            $ref: '#/components/schemas/TimelineActivity'
        metrics:
          $ref: '#/components/schemas/SimulationMetrics'
    ExecutionInfo:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - totalDurationMs
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          const: COMPLETED
        totalDurationMs:
          $ref: '#/components/schemas/DurationMs'
    InitialState:
      type: object
      additionalProperties: false
      required:
      - components
      - requests
      - exchanges
      properties:
        components:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentStatus'
        requests:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RequestStatus'
        exchanges:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExchangeStatus'
    ComponentStatus:
      type: string
      enum:
      - IDLE
      - PROCESSING
      - WAITING
      - COMPLETED
    RequestStatus:
      type: string
      enum:
      - CREATED
      - IN_PROGRESS
      - WAITING_DEPENDENCY
      - COMPLETED
    ExchangeStatus:
      type: string
      enum:
      - CREATED
      - WAITING_RESPONSE
      - COMPLETED
    TraceEntry:
      oneOf:
      - $ref: '#/components/schemas/StateTransitionTrace'
      - $ref: '#/components/schemas/MessageTrace'
      - $ref: '#/components/schemas/ProcessingTrace'
      discriminator:
        propertyName: type
        mapping:
          STATE_TRANSITION: '#/components/schemas/StateTransitionTrace'
          MESSAGE_EVENT: '#/components/schemas/MessageTrace'
          PROCESSING_EVENT: '#/components/schemas/ProcessingTrace'
    StateTransitionTrace:
      type: object
      additionalProperties: false
      required:
      - sequence
      - timestampMs
      - type
      - entityKind
      - entityId
      - previousState
      - newState
      - cause
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        timestampMs:
          $ref: '#/components/schemas/DurationMs'
        type:
          type: string
          const: STATE_TRANSITION
        entityKind:
          type: string
          enum:
          - COMPONENT
          - REQUEST
          - EXCHANGE
        entityId:
          $ref: '#/components/schemas/Identifier'
        previousState:
          type:
          - string
          - 'null'
          description: null somente no registro de criação de entidade fora do snapshot inicial.
        newState:
          type: string
        cause:
          type: string
    MessageTrace:
      type: object
      additionalProperties: false
      required:
      - sequence
      - timestampMs
      - type
      - action
      - messageId
      - requestId
      - exchangeId
      - connectionId
      - sourceId
      - targetId
      - direction
      - intent
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        timestampMs:
          $ref: '#/components/schemas/DurationMs'
        type:
          type: string
          const: MESSAGE_EVENT
        action:
          type: string
          enum:
          - SENT
          - ARRIVED
        messageId:
          $ref: '#/components/schemas/Identifier'
        requestId:
          $ref: '#/components/schemas/Identifier'
        exchangeId:
          $ref: '#/components/schemas/Identifier'
        connectionId:
          $ref: '#/components/schemas/Identifier'
        sourceId:
          $ref: '#/components/schemas/Identifier'
        targetId:
          $ref: '#/components/schemas/Identifier'
        direction:
          type: string
          enum:
          - REQUEST
          - RESPONSE
        intent:
          type: string
          enum:
          - API_REQUEST
          - DATABASE_QUERY
    ProcessingTrace:
      type: object
      additionalProperties: false
      required:
      - sequence
      - timestampMs
      - type
      - action
      - componentId
      - requestId
      - phase
      properties:
        sequence:
          type: integer
          format: int64
          minimum: 1
        timestampMs:
          $ref: '#/components/schemas/DurationMs'
        type:
          type: string
          const: PROCESSING_EVENT
        action:
          type: string
          enum:
          - STARTED
          - COMPLETED
        componentId:
          $ref: '#/components/schemas/Identifier'
        requestId:
          $ref: '#/components/schemas/Identifier'
        phase:
          type: string
          enum:
          - API_PRE_PROCESSING
          - DATABASE_PROCESSING
          - API_POST_PROCESSING
    TimelineActivity:
      oneOf:
      - $ref: '#/components/schemas/CommunicationActivity'
      - $ref: '#/components/schemas/ProcessingActivity'
      discriminator:
        propertyName: kind
        mapping:
          COMMUNICATION: '#/components/schemas/CommunicationActivity'
          PROCESSING: '#/components/schemas/ProcessingActivity'
    CommunicationActivity:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - messageId
      - connectionId
      - sourceId
      - targetId
      - startMs
