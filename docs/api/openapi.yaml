          default: []
          items: {$ref: '#/components/schemas/SessionSetup'}
      description: Cenário v0.4.1; o protocolo está em cada conexão, e não no tipo global do cenário.
    Scenario:
      description: Aceita cenário unificado sem kind e três variantes legadas com kind explícito durante a migração.
      oneOf:
      - $ref: '#/components/schemas/UnifiedScenario'
      - $ref: '#/components/schemas/RequestResponseScenario'
      - $ref: '#/components/schemas/WebSocketScenario'
      - $ref: '#/components/schemas/MessagePublishScenario'
      # Sem discriminator global: a variante unificada não possui kind; oneOf é disjunto por propriedades obrigatórias.
    RequestResponseScenario:
      type: object
      additionalProperties: false
      properties:
        kind: {type: string, const: REQUEST_RESPONSE}
        entryComponentId:
          $ref: '#/components/schemas/Identifier'
        entryConnectionId:
          $ref: '#/components/schemas/Identifier'
        apiExecutions:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ApiExecution'
      required:
      - kind
      - entryComponentId
      - entryConnectionId
      - apiExecutions
      description: Uma requisição raiz, Client e conexão inicial explícitos, e zero ou uma dependência por
        API.
    WebSocketScenario:
      type: object
      additionalProperties: false
      required: [kind, entryComponentId, entryConnectionId]
      properties:
        kind: {type: string, const: WEBSOCKET_SESSION}
        entryComponentId: {$ref: '#/components/schemas/Identifier'}
        entryConnectionId: {$ref: '#/components/schemas/Identifier'}
    MessagePublishScenario:
      type: object
      additionalProperties: false
      required: [kind, entryComponentId, entryConnectionId, destinationName]
      properties:
        kind: {type: string, const: MESSAGE_PUBLISH}
        entryComponentId: {$ref: '#/components/schemas/Identifier'}
        entryConnectionId: {$ref: '#/components/schemas/Identifier'}
        destinationName: {type: string, minLength: 1, maxLength: 256}
        publishCount: {type: integer, minimum: 1, maximum: 100, default: 1}
    SimulationRequest:
      type: object
      additionalProperties: false
      properties:
        architecture:
          $ref: '#/components/schemas/Architecture'
        scenario:
          $ref: '#/components/schemas/Scenario'
      required:
      - architecture
      - scenario
    Violation:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - DUPLICATE_COMPONENT_ID
          - DUPLICATE_CONNECTION_ID
          - DUPLICATE_CONNECTION
          - INVALID_CONNECTION
          - UNKNOWN_COMPONENT
          - INVALID_DURATION
          - CYCLIC_DEPENDENCY
          - INVALID_ENTRY_COMPONENT
          - INVALID_ENTRY_CONNECTION
          - INVALID_SCENARIO_DEPENDENCY
          - DUPLICATE_API_EXECUTION
          - INVALID_INTEGRATION
          - INVALID_MESSAGE_TEMPLATE
          - INVALID_DISPLAY_NAME
          - INVALID_IDENTIFIER
          - INVALID_TOPOLOGY
          - EXCESSIVE_EXECUTION_DURATION
          - INVALID_BEHAVIOR_TRIGGER
          - AMBIGUOUS_BEHAVIOR_MATCH
          - UNKNOWN_ACTION_KIND
          - INVALID_ACTION_DEPENDENCY
          - INVALID_ACTION_CONNECTION
          - INVALID_ACTION_CAPABILITY
          - INVALID_RESPONSE_CONTEXT
          - INVALID_BROKER_DESTINATION
          - SESSION_NOT_OPEN
          - INVALID_SESSION_REFERENCE
          - UNBOUNDED_EXECUTION
          - EXECUTION_LIMIT_EXCEEDED
          - LEGACY_SCENARIO_MIGRATION_REQUIRED
          - INVALID_COMPONENT_CAPABILITY
          - INVALID_RESOURCE_CONNECTION
          - INVALID_ROUTING_RULE
          - INVALID_SCHEDULE
          - INVALID_VIRTUAL_RESOURCE_OPERATION
          - INVALID_DECISION_RULE
          - UNRESOLVED_SERVICE
          - VIRTUAL_RESOURCE_NOT_FOUND
          - VIRTUAL_RESOURCE_EXPIRED
        path:
          type: string
          maxLength: 2048
          minLength: 1
        message:
          type: string
          maxLength: 2048
          minLength: 1
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - path
      - message
      description: Códigos estáveis para validações estruturais, de cenário e de representação.
    ValidationResponse:
      type: object
      additionalProperties: false
      properties:
        valid:
          type: boolean
        violations:
          type: array
          maxItems: 5000
          items:
            $ref: '#/components/schemas/Violation'
      required:
      - valid
      - violations
    Problem:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
          maxLength: 256
          minLength: 1
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          maxLength: 2048
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          maxLength: 128
          minLength: 1
      required:
      - type
      - title
      - status
      - code
      description: RFC 9457 com extensão code.
    InvalidSimulationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        additionalProperties: true
        properties:
          violations:
            type: array
            maxItems: 5000
            items:
              $ref: '#/components/schemas/Violation'
        required:
        - violations
    ComponentStatus:
      type: string
      enum:
      - IDLE
      - PROCESSING
      - WAITING
      - COMPLETED
    RequestStatus:
      type: string
      enum:
      - CREATED
      - IN_PROGRESS
      - WAITING_DEPENDENCY
      - COMPLETED
    ExchangeStatus:
      type: string
      enum:
      - CREATED
      - WAITING_RESPONSE
      - COMPLETED
    InitialState:
      type: object
      additionalProperties: false
      properties:
        components:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ComponentStatus'
        requests:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RequestStatus'
        exchanges:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ExchangeStatus'
      required:
      - components
      - requests
      - exchanges
    ExecutionInfo:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        status:
          type: string
          enum: [COMPLETED, FAILED, TIMED_OUT, COMPLETED_WITH_ERRORS]
        mainStatus:
          type: string
          enum: [COMPLETED, FAILED, TIMED_OUT]
          description: Resultado terminal da operação principal, independente da conclusão global.
        requestId:
          $ref: '#/components/schemas/Identifier'
        entryComponentId:
          $ref: '#/components/schemas/Identifier'
        entryConnectionId:
          $ref: '#/components/schemas/Identifier'
        entryConnectionIds:
          type: array
          items: {$ref: '#/components/schemas/Identifier'}
        mode: {type: string, enum: [UNIFIED]}
        responseStatusCode: {type: integer, minimum: 100, maximum: 599}
        totalDurationMs:
          allOf:
          - $ref: '#/components/schemas/DurationMs'
          maximum: 3600000
      required:
      - id
      - status
      - mainStatus
      - requestId
      - entryComponentId
      - entryConnectionId
      - totalDurationMs
    StateTransitionTrace:
      type: object
      additionalProperties: false
      properties:
        sequence: &id003
          type: integer
          format: int64
          minimum: 1
        timestampMs: &id004
          $ref: '#/components/schemas/DurationMs'
        type:
          type: string
          const: STATE_TRANSITION
        entityKind:
          type: string
          enum:
          - COMPONENT
          - REQUEST
          - EXCHANGE
          - WEBSOCKET_SESSION
          - BROKER_MESSAGE
          - DELIVERY
          - EXECUTION
        entityId:
          $ref: '#/components/schemas/Identifier'
        previousState:
          type:
          - string
          - 'null'
        newState:
          type: string
          maxLength: 128
          minLength: 1
        cause:
          type: string
          maxLength: 128
          minLength: 1
        correlation: {$ref: '#/components/schemas/Correlation'}
      required:
      - sequence
      - timestampMs
      - type
      - entityKind
      - entityId
      - previousState
      - newState
      - cause
    MessageTrace:
      type: object
      additionalProperties: false
      properties:
        sequence: *id003
        timestampMs: *id004
        type:
          type: string
          const: MESSAGE_EVENT
        action:
          type: string
          enum:
          - SENT
          - ARRIVED
        messageId:
          $ref: '#/components/schemas/Identifier'
        requestId:
          $ref: '#/components/schemas/Identifier'
        exchangeId:
          $ref: '#/components/schemas/Identifier'
        parentExchangeId:
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        connectionId:
          $ref: '#/components/schemas/Identifier'
        sourceId:
          $ref: '#/components/schemas/Identifier'
        targetId:
          $ref: '#/components/schemas/Identifier'
        direction:
          type: string
          enum:
          - REQUEST
          - RESPONSE
          - MESSAGE
        intent:
          type: string
          enum:
          - API_REQUEST
          - DATABASE_QUERY
          - WEBSOCKET_OPEN
          - WEBSOCKET_MESSAGE
          - BROKER_PUBLISH
          - BROKER_DELIVERY
          - CACHE_GET
          - CACHE_PUT
          - CACHE_INVALIDATE
          - OBJECT_GET
          - OBJECT_PUT
          - OBJECT_DELETE
          - SEND_NOTIFICATION
          - INDEX_DOCUMENT
          - SEARCH_DOCUMENTS
          - REGISTER_SERVICE
          - UNREGISTER_SERVICE
          - DISCOVER_SERVICE
          - EVALUATE_RULE
        correlation: {$ref: '#/components/schemas/Correlation'}
      required:
      - sequence
      - timestampMs
      - type
      - action
      - messageId
      - requestId
      - exchangeId
      - parentExchangeId
      - connectionId
      - sourceId
      - targetId
      - direction
      - intent
    ProcessingTrace:
      type: object
      additionalProperties: false
      properties:
        sequence: *id003
        timestampMs: *id004
        type:
          type: string
          const: PROCESSING_EVENT
        action:
          type: string
          enum:
          - STARTED
          - COMPLETED
        componentId:
          $ref: '#/components/schemas/Identifier'
        requestId:
          $ref: '#/components/schemas/Identifier'
        phase:
          type: string
          enum:
          - API_PRE_PROCESSING
          - API_POST_PROCESSING
          - DATABASE_PROCESSING
          - API_MESSAGE_PROCESSING
          - VIRTUAL_RESOURCE_PROCESSING
        correlation: {$ref: '#/components/schemas/Correlation'}
      required:
      - sequence
      - timestampMs
      - type
      - action
      - componentId
      - requestId
      - phase
    TraceEntry:
      oneOf:
      - $ref: '#/components/schemas/StateTransitionTrace'
      - $ref: '#/components/schemas/MessageTrace'
      - $ref: '#/components/schemas/ProcessingTrace'
      - $ref: '#/components/schemas/ActionTrace'
      - $ref: '#/components/schemas/ScheduledTriggerTraceV5'
      discriminator:
        propertyName: type
        mapping:
          STATE_TRANSITION: '#/components/schemas/StateTransitionTrace'
          MESSAGE_EVENT: '#/components/schemas/MessageTrace'
          PROCESSING_EVENT: '#/components/schemas/ProcessingTrace'
          ACTION_EVENT: '#/components/schemas/ActionTrace'
          SCHEDULED_TRIGGER: '#/components/schemas/ScheduledTriggerTraceV5'
    ScheduledTriggerTraceV5:
      type: object
      additionalProperties: false
      required: [sequence, timestampMs, type, componentId, operationId, scheduleId, occurrenceId, occurrenceIndex, rootOperationId, scheduledAtMs, firedAtMs]
      properties:
        sequence: *id003
        timestampMs: *id004
        type: {type: string, const: SCHEDULED_TRIGGER}
        componentId: {$ref: '#/components/schemas/Identifier'}
        operationId: {$ref: '#/components/schemas/Identifier'}
        parentExchangeId:
          oneOf:
          - {$ref: '#/components/schemas/Identifier'}
          - {type: 'null'}
        scheduleId: {$ref: '#/components/schemas/Identifier'}
        occurrenceId: {$ref: '#/components/schemas/Identifier'}
        occurrenceIndex: {type: integer, minimum: 1, maximum: 100}
        rootOperationId: {$ref: '#/components/schemas/Identifier'}
        scheduledAtMs: {$ref: '#/components/schemas/DurationMs'}
        firedAtMs: {$ref: '#/components/schemas/DurationMs'}
        correlation: {$ref: '#/components/schemas/Correlation'}
    ActionTrace:
      type: object
      additionalProperties: false
      required: [sequence, timestampMs, type, actionId, componentId, operationId, status, cause]
      properties:
        sequence: *id003
        timestampMs: *id004
        type: {type: string, const: ACTION_EVENT}
        actionId: {$ref: '#/components/schemas/Identifier'}
        componentId: {$ref: '#/components/schemas/Identifier'}
        operationId: {$ref: '#/components/schemas/Identifier'}
        status: {type: string, enum: [STARTED, COMPLETED, FAILED, TIMED_OUT, SKIPPED]}
        cause: {type: string, minLength: 1, maxLength: 128}
        outcome: {$ref: '#/components/schemas/ResourceOutcomeV5'}
        correlation: {$ref: '#/components/schemas/Correlation'}
    CommunicationActivity:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        kind:
          type: string
          const: COMMUNICATION
        messageId:
          $ref: '#/components/schemas/Identifier'
        exchangeId:
          $ref: '#/components/schemas/Identifier'
        connectionId:
          $ref: '#/components/schemas/Identifier'
        sourceId:
          $ref: '#/components/schemas/Identifier'
        targetId:
          $ref: '#/components/schemas/Identifier'
        startMs: &id005
          $ref: '#/components/schemas/DurationMs'
        endMs: &id006
          $ref: '#/components/schemas/DurationMs'
        durationMs: &id007
          $ref: '#/components/schemas/DurationMs'
      required:
      - id
      - kind
      - messageId
      - exchangeId
      - connectionId
      - sourceId
      - targetId
      - startMs
      - endMs
      - durationMs
    ProcessingActivity:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        kind:
          type: string
          const: PROCESSING
        componentId:
          $ref: '#/components/schemas/Identifier'
        requestId:
          $ref: '#/components/schemas/Identifier'
        phase:
          type: string
          enum:
          - API_PRE_PROCESSING
          - API_POST_PROCESSING
          - DATABASE_PROCESSING
          - API_MESSAGE_PROCESSING
          - VIRTUAL_RESOURCE_PROCESSING
        startMs: *id005
        endMs: *id006
        durationMs: *id007
      required:
      - id
      - kind
      - componentId
      - requestId
      - phase
      - startMs
      - endMs
      - durationMs
    TimelineActivity:
      oneOf:
      - $ref: '#/components/schemas/CommunicationActivity'
      - $ref: '#/components/schemas/ProcessingActivity'
      discriminator:
        propertyName: kind
        mapping:
          COMMUNICATION: '#/components/schemas/CommunicationActivity'
          PROCESSING: '#/components/schemas/ProcessingActivity'
    ProcessingMetric:
      type: object
      additionalProperties: false
      properties:
        componentId:
          $ref: '#/components/schemas/Identifier'
        durationMs:
          $ref: '#/components/schemas/DurationMs'
      required:
      - componentId
      - durationMs
    CommunicationMetric:
      type: object
      additionalProperties: false
      properties:
        connectionId:
          $ref: '#/components/schemas/Identifier'
        traversals:
          type: integer
          minimum: 1
        durationMs:
          $ref: '#/components/schemas/DurationMs'
      required:
      - connectionId
      - traversals
      - durationMs
    WaitingMetric:
      type: object
      additionalProperties: false
      properties:
        componentId:
          $ref: '#/components/schemas/Identifier'
        exchangeId:
          $ref: '#/components/schemas/Identifier'
        startMs:
          $ref: '#/components/schemas/DurationMs'
        endMs:
          $ref: '#/components/schemas/DurationMs'
        durationMs:
          $ref: '#/components/schemas/DurationMs'
      required:
      - componentId
      - exchangeId
      - startMs
      - endMs
      - durationMs
    ExchangeMetric:
      type: object
      additionalProperties: false
      properties:
        exchangeId:
          $ref: '#/components/schemas/Identifier'
        parentExchangeId:
          oneOf:
          - $ref: '#/components/schemas/Identifier'
          - type: 'null'
        callerComponentId:
          $ref: '#/components/schemas/Identifier'
        calleeComponentId:
          $ref: '#/components/schemas/Identifier'
        connectionId:
          $ref: '#/components/schemas/Identifier'
        startMs:
          $ref: '#/components/schemas/DurationMs'
        endMs:
          $ref: '#/components/schemas/DurationMs'
        durationMs:
          $ref: '#/components/schemas/DurationMs'
      required:
      - exchangeId
      - parentExchangeId
      - callerComponentId
      - calleeComponentId
      - connectionId
      - startMs
      - endMs
      - durationMs
    WebSocketMetric:
      type: object
      additionalProperties: false
      required: [connectionId, messagesSent, messagesReceived, durationMs]
      properties:
        connectionId: {$ref: '#/components/schemas/Identifier'}
        sessionId: {$ref: '#/components/schemas/Identifier'}
        messagesSent: {type: integer, minimum: 0, maximum: 100}
        messagesReceived: {type: integer, minimum: 0, maximum: 100}
        durationMs: {$ref: '#/components/schemas/DurationMs'}
    MessagingMetric:
      type: object
      additionalProperties: false
      required: [connectionId, published, delivered, processed, pending]
      properties:
        connectionId: {$ref: '#/components/schemas/Identifier'}
        published: {type: integer, minimum: 0, maximum: 100}
        delivered: {type: integer, minimum: 0, maximum: 1000}
        processed: {type: integer, minimum: 0, maximum: 1000}
        pending: {type: integer, minimum: 0, maximum: 1000}
        failures: {type: integer, minimum: 0, maximum: 1000, default: 0}
        eligibleSubscribers: {type: integer, minimum: 0, maximum: 100, default: 0}
    SimulationMetrics:
      type: object
      additionalProperties: false
      properties:
        totalDurationMs:
          $ref: '#/components/schemas/DurationMs'
        processingByComponent:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ProcessingMetric'
        communicationByConnection:
          type: array
          maxItems: 3000
          items:
            $ref: '#/components/schemas/CommunicationMetric'
        waitingByComponent:
          type: array
          maxItems: 3000
          items:
            $ref: '#/components/schemas/WaitingMetric'
        exchanges:
          type: array
          maxItems: 3000
          items:
            $ref: '#/components/schemas/ExchangeMetric'
        websocket:
          type: array
          maxItems: 3000
          items: {$ref: '#/components/schemas/WebSocketMetric'}
          default: []
        messaging:
          type: array
          maxItems: 3000
          items: {$ref: '#/components/schemas/MessagingMetric'}
          default: []
      required:
      - totalDurationMs
      - processingByComponent
      - communicationByConnection
      - waitingByComponent
      - exchanges
      description: Esperas aninhadas se sobrepõem; não somar a totalDurationMs.
    MessageRepresentation:
      type: object
      additionalProperties: false
      properties:
        connectionId:
          $ref: '#/components/schemas/Identifier'
        integration:
          $ref: '#/components/schemas/Integration'
      required:
      - connectionId
      - integration
      description: Snapshot imutável da integração efetivamente utilizada para inspeção independente do editor.
    Correlation:
      type: object
      additionalProperties: false
      properties:
        operationId: {$ref: '#/components/schemas/Identifier'}
        parentOperationId:
          anyOf:
          - {$ref: '#/components/schemas/Identifier'}
          - {type: 'null'}
        sessionId: {$ref: '#/components/schemas/Identifier'}
        profile: {type: string}
    ResourceState:
      type: object
      additionalProperties: false
      required: [id, kind, status]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, enum: [REQUEST, WEBSOCKET_SESSION, BROKER_MESSAGE, DELIVERY]}
        status: {type: string}
        correlation: {$ref: '#/components/schemas/Correlation'}
    SimulationResponse:
      type: object
      additionalProperties: false
      properties:
        execution:
          $ref: '#/components/schemas/ExecutionInfo'
        initialState:
          $ref: '#/components/schemas/InitialState'
        trace:
          type: array
          maxItems: 50000
          items:
            $ref: '#/components/schemas/TraceEntry'
        timeline:
          type: array
          maxItems: 30000
          items:
            $ref: '#/components/schemas/TimelineActivity'
        metrics:
          $ref: '#/components/schemas/SimulationMetrics'
        messageRepresentations:
          type: array
          maxItems: 3000
          items:
            $ref: '#/components/schemas/MessageRepresentation'
        resourceStates:
          type: array
          maxItems: 1000
          default: []
          items: {$ref: '#/components/schemas/ResourceState'}
        resourceOutcomes:
          type: array
          maxItems: 50000
          default: []
          items: {$ref: '#/components/schemas/ResourceOutcomeV5'}
        rootOperations:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, connectionId, kind, status, completedAtMs]
            properties:
              id: {$ref: '#/components/schemas/Identifier'}
              connectionId: {$ref: '#/components/schemas/Identifier'}
              kind: {type: string}
              status: {type: string, enum: [COMPLETED, TIMED_OUT]}
              completedAtMs: {$ref: '#/components/schemas/DurationMs'}
      required:
      - execution
      - initialState
      - trace
      - timeline
      - metrics
      - messageRepresentations
  responses:
    BadRequest:
      description: JSON ausente, malformado ou incompatível com o schema.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Corpo HTTP acima do limite configurado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Somente application/json é aceito.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Falha interna do servidor, sem exposição de dados sensíveis.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidSimulation:
      description: Arquitetura ou cenário semanticamente inválido para execução.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidSimulationProblem'
  examples:
    mixedCommunicationRequest:
      summary: Entrada REST, publicação em Queue e notificação por WebSocket (contrato v0.4.1)
      description: Exemplo executável pelo backend v0.4.1.
      value:
        architecture:
          components:
          - {id: browser, type: WEB_BROWSER, displayName: Navegador}
          - id: orders-api
            type: API
            displayName: API Pedidos
            behaviors:
            - id: handle-create-order
              trigger: REQUEST_RECEIVED
              match: {operation: 'POST /pedidos'}
              actions:
              - {id: publish, kind: PUBLISH, connectionId: orders-broker, destinationName: pedidos}
              - {id: respond, kind: RESPOND, statusCode: 201, dependsOn: [publish]}
          - id: broker
            type: BROKER
            displayName: Broker
            destinations:
            - {name: pedidos, kind: QUEUE}
            subscriptions:
            - {destinationName: pedidos, consumerComponentId: notifications, connectionId: broker-notifications}
          - id: notifications
            type: API
            displayName: API Notificações
            behaviors:
            - id: handle-delivery
              trigger: MESSAGE_CONSUMED
              match: {destinationName: pedidos}
              actions:
              - {id: send, kind: WS_SEND, sessionAlias: notifications-session, payload: 'Pedido criado', sender: TARGET}
          connections:
          - id: browser-orders
            sourceId: browser
            targetId: orders-api
            latencyMs: 10
            integration:
              kind: HTTP_REST
              request: {method: POST, path: /pedidos}
              response: {statusCode: 201}
          - id: orders-broker
            sourceId: orders-api
            targetId: broker
            latencyMs: 5
            integration: {kind: QUEUE, queueName: pedidos}
          - id: broker-notifications
            sourceId: broker
            targetId: notifications
            latencyMs: 5
            integration: {kind: QUEUE, queueName: pedidos}
          - id: notifications-websocket
            sourceId: browser
            targetId: notifications
            latencyMs: 5
            integration: {kind: WEBSOCKET, path: /notificacoes, closeMode: AUTOMATIC}
        scenario:
          entry: {componentId: browser, connectionId: browser-orders, operation: 'POST /pedidos'}
          sessionSetup:
          - {connectionId: notifications-websocket, sessionAlias: notifications-session, autoCloseAtEnd: true}
    v5CacheBranchScenario:
      summary: Service consulta Cache e executa ramo MISS explicitamente
      description: Exemplo executável de Cache MISS com seleção explícita do ramo Database.
      value:
        architecture:
          components:
          - {id: browser, type: WEB_BROWSER, displayName: Web Browser}
          - id: orders
            type: SERVICE
            displayName: Serviço de Pedidos
