openapi: 3.1.0
info:
  title: ArchLab Simulation API (unificada /api/v1)
  version: 0.5.0-contract-draft
  description: Contrato canônico v1 com cenário unificado e formatos anteriores; simulação semântica determinística sem protocolos de rede reais.
servers:
- url: /
# API de simulacao local sem mecanismo de autenticacao especificado nesta versao.
# Revisar quando houver requisitos reais de autenticacao/autorizacao.
security: []
tags:
- name: Architectures
  description: Validação estrutural do grafo.
- name: Scenarios
  description: Validação do cenário de execução.
- name: Simulations
  description: Execução determinística e resultados completos.
paths:
  /api/v1/architectures/validate:
    post:
      tags:
      - Architectures
      operationId: validateArchitecture
      summary: Validar estrutura do grafo
      description: Valida IDs, direções, modalidades de integração, duplicidade e ciclos no grafo completo.
        Não exige cenário, não simula. HTTP 200 com valid=false para violações de domínio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Architecture'
            examples:
              sample:
                $ref: '#/components/examples/architecture'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                sample:
                  $ref: '#/components/examples/validationValid'
                invalid:
                  $ref: '#/components/examples/validationInvalid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/scenarios/validate:
    post:
      tags:
      - Scenarios
      operationId: validateScenario
      summary: Validar arquitetura e cenário selecionado
      description: Valida primeiro a arquitetura completa, depois Client e conexão inicial, dependências e
        configurações do cenário. Não executa o motor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
            examples:
              sample:
                $ref: '#/components/examples/scenario'
              cacheBranchV5:
                $ref: '#/components/examples/v5CacheBranchScenario'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResponse'
              examples:
                sample:
                  $ref: '#/components/examples/validationValid'
                invalid:
                  $ref: '#/components/examples/validationInvalid'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/simulations:
    post:
      tags:
      - Simulations
      operationId: executeSimulation
      summary: Executar cenário determinístico
      description: Revalida arquitetura e cenário, executa uma requisição principal em memória e devolve trace
        integral para playback local. Não há rede real ou persistência.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
            examples:
              sample:
                $ref: '#/components/examples/simulationRequest'
              mixedCommunication:
                $ref: '#/components/examples/mixedCommunicationRequest'
              cacheBranchV5:
                $ref: '#/components/examples/v5CacheBranchScenario'
      responses:
        '200':
          description: Operação concluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
              examples:
                sample:
                  $ref: '#/components/examples/simulationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/InvalidSimulation'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: .*\S.*
      description: ID lógico não vazio; unicidade e referências são verificadas pelo validador de domínio.
    DisplayName:
      type: string
      minLength: 1
      maxLength: 80
      pattern: .*\S.*
      description: Nome legível; limite em Unicode code points conforme JSON Schema. Remove-se espaço nas extremidades
        na validação de domínio.
    DurationMs:
      type: integer
      format: int64
      minimum: 0
      maximum: 1000000000
      description: Milissegundos virtuais inteiros. Limite operacional inicial de 1 bilhão por propriedade;
        overflow da execução é rejeitado.
    Headers:
      type: object
      maxProperties: 32
      propertyNames:
        type: string
        minLength: 1
        maxLength: 128
      additionalProperties:
        type: string
        maxLength: 1024
      description: Mapa de cabeçalhos ilustrativos, não enviados na rede.
    HttpRequest:
      type: object
      additionalProperties: false
      properties:
        method:
          type: string
          enum:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
        path:
          type: string
          maxLength: 2048
          minLength: 1
        headers:
          $ref: '#/components/schemas/Headers'
        body:
          type: string
          maxLength: 32768
      required:
      - method
      - path
      description: Dados HTTP ilustrativos; headers e body são opcionais.
    HttpResponse:
      type: object
      additionalProperties: false
      properties:
        statusCode:
          type: integer
          minimum: 100
          maximum: 599
        headers:
          $ref: '#/components/schemas/Headers'
        body:
          type: string
          maxLength: 32768
      required:
      - statusCode
      description: Código HTTP ilustrativo, sem propagação automática de falhas.
    HttpRestIntegration:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: HTTP_REST
          type: string
        request:
          $ref: '#/components/schemas/HttpRequest'
        response:
          $ref: '#/components/schemas/HttpResponse'
      required:
      - kind
      description: Integração HTTP/REST; request/response opcionais recebem modelos padrão para inspeção.
    SoapHttpIntegration:
      type: object
      additionalProperties: false
      properties:
        kind:
          const: SOAP_HTTP
          type: string
        soapVersion:
          type: string
          const: '1.2'
        operation:
          type: string
          maxLength: 256
        action:
          type: string
          maxLength: 2048
        requestEnvelope:
          type: string
          maxLength: 32768
        responseEnvelope:
          type: string
          maxLength: 32768
        httpStatusCode:
          type: integer
          minimum: 100
          maximum: 599
        requestHeaders:
          $ref: '#/components/schemas/Headers'
        responseHeaders:
          $ref: '#/components/schemas/Headers'
      required:
      - kind
      - soapVersion
      description: SOAP 1.2 sobre HTTP; envelopes opcionais são ilustrativos, não executados. XML fornecido
        deve ser bem-formado, sem entidades externas; sem WSDL/XSD.
    DatabaseQueryIntegration:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: DATABASE_QUERY
        queryText:
          type: string
          maxLength: 32768
        responseText:
          type: string
          maxLength: 32768
      required:
      - kind
      description: Consulta ilustrativa, sem execução de SQL e sem banco real.
    HttpGenericIntegration:
      type: object
      additionalProperties: false
      required: [kind, method, path]
      properties:
        kind: {type: string, const: HTTP_GENERIC}
        method: {type: string, enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]}
        path: {type: string, minLength: 1, maxLength: 2048}
    GraphqlHttpIntegration:
      type: object
      additionalProperties: false
      required: [kind, operationType, operationName]
      properties:
        kind: {type: string, const: GRAPHQL_HTTP}
        operationType: {type: string, enum: [QUERY, MUTATION]}
        operationName: {type: string, minLength: 1, maxLength: 256}
    GrpcUnaryIntegration:
      type: object
      additionalProperties: false
      required: [kind, service, method]
      properties:
        kind: {type: string, const: GRPC_UNARY}
        service: {type: string, minLength: 1, maxLength: 256}
        method: {type: string, minLength: 1, maxLength: 256}
    CoapIntegration:
      type: object
      additionalProperties: false
      required: [kind, method, resource]
      properties:
        kind: {type: string, const: COAP}
        method: {type: string, enum: [GET, POST, PUT, DELETE]}
        resource: {type: string, minLength: 1, maxLength: 2048}
        mode: {type: string, enum: [CON, NON], default: CON}
    WebSocketMessage:
      type: object
      additionalProperties: false
      required: [sender, intervalMs]
      properties:
        sender: {type: string, enum: [SOURCE, TARGET]}
        intervalMs: {type: integer, format: int64, minimum: 0, default: 0}
        payload: {type: string, maxLength: 32768}
    WebSocketIntegration:
      type: object
      additionalProperties: false
      required: [kind, path]
      properties:
        kind: {type: string, const: WEBSOCKET}
        path: {type: string, minLength: 1, maxLength: 2048}
        connectTimeoutMs: {type: integer, format: int64, minimum: 0, default: 5000}
        idleTimeoutMs: {type: [integer, 'null'], format: int64, minimum: 0, default: null}
        closeMode: {type: string, enum: [AUTOMATIC, EXPLICIT], default: AUTOMATIC}
        messages:
          type: array
          maxItems: 100
          default: []
          items: {$ref: '#/components/schemas/WebSocketMessage'}
    MqttIntegration:
      type: object
      additionalProperties: false
      required: [kind, topic]
      properties:
        kind: {type: string, const: MQTT}
        topic:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^[^+#]+$'
        qos: {type: integer, const: 0, default: 0}
    QueueIntegration:
      type: object
      additionalProperties: false
      required: [kind, queueName]
      properties:
        kind: {type: string, const: QUEUE}
        queueName: {type: string, minLength: 1, maxLength: 256}
    TopicIntegration:
      type: object
      additionalProperties: false
      required: [kind, topic]
      properties:
        kind: {type: string, const: TOPIC}
        topic: {type: string, minLength: 1, maxLength: 256}
    Integration:
      oneOf:
      - $ref: '#/components/schemas/HttpRestIntegration'
      - $ref: '#/components/schemas/SoapHttpIntegration'
      - $ref: '#/components/schemas/DatabaseQueryIntegration'
      - $ref: '#/components/schemas/HttpGenericIntegration'
      - $ref: '#/components/schemas/GraphqlHttpIntegration'
      - $ref: '#/components/schemas/GrpcUnaryIntegration'
      - $ref: '#/components/schemas/CoapIntegration'
      - $ref: '#/components/schemas/WebSocketIntegration'
      - $ref: '#/components/schemas/MqttIntegration'
      - $ref: '#/components/schemas/QueueIntegration'
      - $ref: '#/components/schemas/TopicIntegration'
      discriminator:
        propertyName: kind
        mapping:
          HTTP_REST: '#/components/schemas/HttpRestIntegration'
          SOAP_HTTP: '#/components/schemas/SoapHttpIntegration'
          DATABASE_QUERY: '#/components/schemas/DatabaseQueryIntegration'
          HTTP_GENERIC: '#/components/schemas/HttpGenericIntegration'
          GRAPHQL_HTTP: '#/components/schemas/GraphqlHttpIntegration'
          GRPC_UNARY: '#/components/schemas/GrpcUnaryIntegration'
          COAP: '#/components/schemas/CoapIntegration'
          WEBSOCKET: '#/components/schemas/WebSocketIntegration'
          MQTT: '#/components/schemas/MqttIntegration'
          QUEUE: '#/components/schemas/QueueIntegration'
          TOPIC: '#/components/schemas/TopicIntegration'
    Client:
      type: object
      additionalProperties: false
      properties:
        id: &id001
          $ref: '#/components/schemas/Identifier'
        displayName: &id002
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: CLIENT
      required:
      - id
      - type
      - displayName
    WEB_BROWSERClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: WEB_BROWSER
      required:
      - id
      - type
      - displayName
    MOBILE_APPClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: MOBILE_APP
      required:
      - id
      - type
      - displayName
    DESKTOP_APPClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: DESKTOP_APP
      required:
      - id
      - type
      - displayName
    CLIClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: CLI
      required:
      - id
      - type
      - displayName
    BOTClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: BOT
      required:
      - id
      - type
      - displayName
    EMBEDDED_SYSTEMClient:
      type: object
      additionalProperties: false
      properties:
        id: 
          $ref: '#/components/schemas/Identifier'
        displayName: 
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: EMBEDDED_SYSTEM
      required:
      - id
      - type
      - displayName
    Api:
      description: 'DEPRECATED v0.5: tipo de componente aceito somente para importação/migração de arquiteturas anteriores. Novos modelos devem usar SERVICE; API é interface exposta pelo Service, não nó independente.'
      deprecated: true
      type: object
      additionalProperties: false
      properties:
        id: *id001
        displayName: *id002
        type:
          type: string
          const: API
        behaviors:
          type: array
          maxItems: 100
          default: []
          items: {$ref: '#/components/schemas/Behavior'}
        preProcessingMs:
          allOf:
          - $ref: '#/components/schemas/DurationMs'
          default: 0
        postProcessingMs:
          allOf:
          - $ref: '#/components/schemas/DurationMs'
          default: 0
      required:
      - id
      - type
      - displayName
    Database:
      type: object
      additionalProperties: false
      properties:
        id: *id001
        displayName: *id002
        type:
          type: string
          const: DATABASE
        processingMs:
          $ref: '#/components/schemas/DurationMs'
      required:
      - id
      - type
      - displayName
      - processingMs
    Broker:
      type: object
      additionalProperties: false
      required: [id, type, displayName]
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        displayName:
          $ref: '#/components/schemas/DisplayName'
        type:
          type: string
          const: BROKER
        destinations:
          type: array
          maxItems: 3000
          default: []
          items:
            $ref: '#/components/schemas/BrokerDestination'
        subscriptions:
          type: array
          maxItems: 3000
          default: []
          items:
            $ref: '#/components/schemas/BrokerSubscription'
    BrokerDestination:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        kind:
          type: string
          enum: [QUEUE, TOPIC, MQTT]
    BrokerSubscription:
      type: object
      additionalProperties: false
      required: [destinationName, consumerComponentId, connectionId]
      properties:
        destinationName:
          type: string
          minLength: 1
          maxLength: 256
        consumerComponentId:
          $ref: '#/components/schemas/Identifier'
        connectionId:
          $ref: '#/components/schemas/Identifier'
    Behavior:
      type: object
      additionalProperties: false
      required: [id, trigger, actions]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        trigger:
          type: string
          enum: [REQUEST_RECEIVED, MESSAGE_CONSUMED, WS_MESSAGE_RECEIVED, SESSION_OPENED, SCHEDULED_TRIGGER]
        match:
          $ref: '#/components/schemas/BehaviorMatcher'
        actions:
          type: array
          minItems: 1
          maxItems: 100
          items: {$ref: '#/components/schemas/BehaviorAction'}
      description: Plano declarativo finito executado apenas quando o gatilho correspondente ocorre.
    BehaviorMatcher:
      type: object
      additionalProperties: false
      properties:
        operation: {type: string, minLength: 1, maxLength: 256}
        destinationName: {type: string, minLength: 1, maxLength: 256}
        websocketPath: {type: string, minLength: 1, maxLength: 2048}
        scheduleId: {$ref: '#/components/schemas/Identifier'}
      minProperties: 1
      description: Tipo de filtro aplicável ao gatilho é validado semanticamente.
    ActionDependencies:
      type: array
      maxItems: 100
      uniqueItems: true
      default: []
      items: {$ref: '#/components/schemas/Identifier'}
      description: Referências de ações locais; o validador exige DAG acíclico.
    BehaviorAction:
      oneOf:
      - $ref: '#/components/schemas/ProcessAction'
      - $ref: '#/components/schemas/CallAction'
      - $ref: '#/components/schemas/PublishAction'
      - $ref: '#/components/schemas/RespondAction'
      - $ref: '#/components/schemas/OpenSessionAction'
      - $ref: '#/components/schemas/WsSendAction'
      - $ref: '#/components/schemas/CloseSessionAction'
      - $ref: '#/components/schemas/ForkAction'
      - $ref: '#/components/schemas/JoinAction'
      - $ref: '#/components/schemas/BranchActionV5'
      - $ref: '#/components/schemas/CacheGetActionV5'
      - $ref: '#/components/schemas/CachePutActionV5'
      - $ref: '#/components/schemas/CacheInvalidateActionV5'
      - $ref: '#/components/schemas/ObjectGetActionV5'
      - $ref: '#/components/schemas/ObjectPutActionV5'
      - $ref: '#/components/schemas/ObjectDeleteActionV5'
      - $ref: '#/components/schemas/SendNotificationActionV5'
      - $ref: '#/components/schemas/IndexDocumentActionV5'
      - $ref: '#/components/schemas/SearchDocumentsActionV5'
      - $ref: '#/components/schemas/RegisterServiceActionV5'
      - $ref: '#/components/schemas/UnregisterServiceActionV5'
      - $ref: '#/components/schemas/DiscoverServiceActionV5'
      - $ref: '#/components/schemas/EvaluateRuleActionV5'
      - $ref: '#/components/schemas/ScheduleTriggerActionV5'
      - $ref: '#/components/schemas/TransformActionV5'
      discriminator:
        propertyName: kind
        mapping:
          PROCESS: '#/components/schemas/ProcessAction'
          CALL: '#/components/schemas/CallAction'
          PUBLISH: '#/components/schemas/PublishAction'
          RESPOND: '#/components/schemas/RespondAction'
          OPEN_SESSION: '#/components/schemas/OpenSessionAction'
          WS_SEND: '#/components/schemas/WsSendAction'
          CLOSE_SESSION: '#/components/schemas/CloseSessionAction'
          FORK: '#/components/schemas/ForkAction'
          JOIN: '#/components/schemas/JoinAction'
          BRANCH: '#/components/schemas/BranchActionV5'
          CACHE_GET: '#/components/schemas/CacheGetActionV5'
          CACHE_PUT: '#/components/schemas/CachePutActionV5'
          CACHE_INVALIDATE: '#/components/schemas/CacheInvalidateActionV5'
          OBJECT_GET: '#/components/schemas/ObjectGetActionV5'
          OBJECT_PUT: '#/components/schemas/ObjectPutActionV5'
          OBJECT_DELETE: '#/components/schemas/ObjectDeleteActionV5'
          SEND_NOTIFICATION: '#/components/schemas/SendNotificationActionV5'
          INDEX_DOCUMENT: '#/components/schemas/IndexDocumentActionV5'
          SEARCH_DOCUMENTS: '#/components/schemas/SearchDocumentsActionV5'
          REGISTER_SERVICE: '#/components/schemas/RegisterServiceActionV5'
          UNREGISTER_SERVICE: '#/components/schemas/UnregisterServiceActionV5'
          DISCOVER_SERVICE: '#/components/schemas/DiscoverServiceActionV5'
          EVALUATE_RULE: '#/components/schemas/EvaluateRuleActionV5'
          SCHEDULE_TRIGGER: '#/components/schemas/ScheduleTriggerActionV5'
          TRANSFORM: '#/components/schemas/TransformActionV5'
    ProcessAction:
      type: object
      additionalProperties: false
      required: [id, kind]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, const: PROCESS}
        dependsOn: {$ref: '#/components/schemas/ActionDependencies'}
        durationMs: {$ref: '#/components/schemas/DurationMs'}
    CallAction:
      type: object
      additionalProperties: false
      required: [id, kind, connectionId]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, const: CALL}
        dependsOn: {$ref: '#/components/schemas/ActionDependencies'}
        connectionId: {$ref: '#/components/schemas/Identifier'}
        timeoutMs: {$ref: '#/components/schemas/DurationMs'}
    PublishAction:
      type: object
      additionalProperties: false
      required: [id, kind, connectionId, destinationName]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, const: PUBLISH}
        dependsOn: {$ref: '#/components/schemas/ActionDependencies'}
        connectionId: {$ref: '#/components/schemas/Identifier'}
        destinationName: {type: string, minLength: 1, maxLength: 256}
    RespondAction:
      type: object
      additionalProperties: false
      required: [id, kind]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, const: RESPOND}
        dependsOn: {$ref: '#/components/schemas/ActionDependencies'}
        statusCode: {type: integer, minimum: 100, maximum: 599, default: 200}
    OpenSessionAction:
      type: object
      additionalProperties: false
      required: [id, kind, connectionId]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, const: OPEN_SESSION}
        dependsOn: {$ref: '#/components/schemas/ActionDependencies'}
        connectionId: {$ref: '#/components/schemas/Identifier'}
        sessionAlias: {$ref: '#/components/schemas/Identifier'}
    WsSendAction:
      type: object
      additionalProperties: false
      required: [id, kind, sessionAlias]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, const: WS_SEND}
        dependsOn: {$ref: '#/components/schemas/ActionDependencies'}
        sessionAlias: {$ref: '#/components/schemas/Identifier'}
        payload: {type: string, maxLength: 32768}
        sender: {type: string, enum: [SOURCE, TARGET]}
    CloseSessionAction:
      type: object
      additionalProperties: false
      required: [id, kind, sessionAlias]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, const: CLOSE_SESSION}
        dependsOn: {$ref: '#/components/schemas/ActionDependencies'}
        sessionAlias: {$ref: '#/components/schemas/Identifier'}
    ForkAction:
      type: object
      additionalProperties: false
      required: [id, kind, actionIds]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, const: FORK}
        dependsOn: {$ref: '#/components/schemas/ActionDependencies'}
        actionIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
    JoinAction:
      type: object
      additionalProperties: false
      required: [id, kind, actionIds]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        kind: {type: string, const: JOIN}
        dependsOn: {$ref: '#/components/schemas/ActionDependencies'}
        actionIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: {$ref: '#/components/schemas/Identifier'}
    VirtualScheduleV5:
      type: object
      additionalProperties: false
      required: [id, firstAtMs, intervalMs, occurrenceCount]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        firstAtMs: {type: integer, minimum: 0, maximum: 3600000}
        intervalMs: {type: integer, minimum: 0, maximum: 3600000}
        occurrenceCount: {type: integer, minimum: 1, maximum: 100}
        behaviorId: {$ref: '#/components/schemas/Identifier'}
    ServiceRouteV5:
      type: object
      additionalProperties: false
      required: [operation, connectionId]
      properties:
        operation: {type: string, minLength: 1, maxLength: 256}
