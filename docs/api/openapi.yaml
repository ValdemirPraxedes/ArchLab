        resourceStates:
          type: array
          maxItems: 1000
          default: []
          items: {$ref: '#/components/schemas/ResourceState'}
      required:
      - execution
      - initialState
      - trace
      - timeline
      - metrics
      - messageRepresentations
  responses:
    BadRequest:
      description: JSON ausente, malformado ou incompatível com o schema.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    PayloadTooLarge:
      description: Corpo HTTP acima do limite configurado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Somente application/json é aceito.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Falha interna do servidor, sem exposição de dados sensíveis.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidSimulation:
      description: Arquitetura ou cenário semanticamente inválido para execução.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/InvalidSimulationProblem'
  examples:
    simulationRequest:
      summary: Client → API Pedidos → API Estoque (100 ms)
      value:
        architecture: &id008
          components:
          - id: client-web
            type: CLIENT
            displayName: Aplicação Web
          - id: api-pedidos
            type: API
            displayName: API de Pedidos
            preProcessingMs: 20
            postProcessingMs: 10
          - id: api-estoque
            type: API
            displayName: API de Estoque
            preProcessingMs: 30
            postProcessingMs: 10
          connections:
          - id: conn-1
            sourceId: client-web
            targetId: api-pedidos
            latencyMs: 10
            integration: &id010
              kind: HTTP_REST
              request:
                method: POST
                path: /pedidos
                headers: {}
                body: '{"produtoId":123}'
              response:
                statusCode: 201
                headers: {}
                body: '{"pedidoId":456}'
          - id: conn-2
            sourceId: api-pedidos
            targetId: api-estoque
            latencyMs: 5
            integration: &id011
              kind: HTTP_REST
              request:
                method: GET
                path: /estoque/123
              response:
                statusCode: 200
                body: '{"disponivel":true}'
        scenario: &id009
          kind: REQUEST_RESPONSE
          entryComponentId: client-web
          entryConnectionId: conn-1
          apiExecutions:
          - componentId: api-pedidos
            dependencyConnectionId: conn-2
    architecture:
      summary: Arquitetura com duas APIs
      value: *id008
    scenario:
      summary: Cenário com chamada API → API
      value:
        architecture: *id008
        scenario: *id009
