    ApiProcessingOverride:
      type: object
      additionalProperties: false
      description: Tempos efetivos de pré e pós-processamento do destino, para API histórica ou SERVICE quando esta política for aplicável. Ambos obrigatórios; não permitido em conexão a Database. Regras de compatibilidade validadas pelo domínio.
      properties:
        preProcessingMs:
          $ref: '#/components/schemas/DurationMs'
        postProcessingMs:
          $ref: '#/components/schemas/DurationMs'
      required:
      - preProcessingMs
      - postProcessingMs
    Connection:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        sourceId:
          $ref: '#/components/schemas/Identifier'
        targetId:
          $ref: '#/components/schemas/Identifier'
        latencyMs:
          allOf:
          - $ref: '#/components/schemas/DurationMs'
          default: 0
        integration:
          $ref: '#/components/schemas/Integration'
        apiProcessingOverride:
          $ref: '#/components/schemas/ApiProcessingOverride'
          description: Campo histórico apiProcessingOverride mantido por compatibilidade. No v0.5, também pode definir tempos de SERVICE destinatário em conexão de request/response compatível; ausente preserva padrão do componente.
      required:
      - id
      - sourceId
      - targetId
      - integration
      description: Conexão lógica dirigida; resposta percorre a conexão em sentido inverso. Unicidade por par
        não ordenado de componentes. apiProcessingOverride é opcional para API antiga ou SERVICE de destino em chamadas request/response compatíveis;
        se ausente, prevalecem os tempos padrão do componente (0 ms para omitidos). DATABASE_QUERY não aceita override.
