      type: object
      additionalProperties: false
      properties:
        components:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/Component'
        connections:
          type: array
          maxItems: 3000
          items:
            $ref: '#/components/schemas/Connection'
      required:
      - components
      - connections
      description: Candidata à validação, podendo estar incompleta. Para criação v0.5 usar SERVICE (não API). Entrada histórica type API é tolerada somente pelo adaptador explícito de migração. Regras de topologia/ciclo aplicadas no
        domínio.
