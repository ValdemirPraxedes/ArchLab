        endMs: *id006
        durationMs: *id007
      required:
      - id
      - kind
      - componentId
      - requestId
      - phase
      - startMs
      - endMs
      - durationMs
    TimelineActivity:
      oneOf:
      - $ref: '#/components/schemas/CommunicationActivity'
      - $ref: '#/components/schemas/ProcessingActivity'
      discriminator:
        propertyName: kind
        mapping:
          COMMUNICATION: '#/components/schemas/CommunicationActivity'
          PROCESSING: '#/components/schemas/ProcessingActivity'
    ProcessingMetric:
      type: object
