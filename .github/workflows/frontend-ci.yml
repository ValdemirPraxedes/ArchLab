name: Frontend CI
on:
  push:
    paths:
      - 'frontend/**'
      - 'docs/api/openapi.yaml'
      - 'docs/api/openapi-v2.yaml'
      - 'docs/api/openapi-v3.yaml'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'docs/api/openapi.yaml'
      - 'docs/api/openapi-v2.yaml'
      - 'docs/api/openapi-v3.yaml'
      - '.github/workflows/frontend-ci.yml'
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
