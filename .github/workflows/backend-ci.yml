name: Backend CI
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'tools/validate-v3-results.cjs'
      - 'frontend/scripts/integration*.mjs'
      - 'frontend/src/api/archlabV3Client*'
      - 'frontend/src/features/v3/resultAdapterV3.ts'
      - 'frontend/src/features/v3/replayV3.ts'
      - 'frontend/src/features/v3/contractChecksV3.ts'
      - 'frontend/scripts/integration-v3-client.ts'
      - 'frontend/src/features/v3/__fixtures__/**'
      - 'docs/api/openapi-v3.yaml'
      - 'docs/examples/v3/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: 'backend/**/pom.xml'
      - run: chmod +x mvnw
      - run: ./mvnw -B clean verify

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated contract validators
        run: npm install --prefix "$RUNNER_TEMP/archlab-v3-contract" --no-save --no-package-lock yaml@2.9.1 ajv@8.20.0 ajv-formats@3.0.1
      - name: Validate actual v3 HTTP and result artifacts
        run: node ../tools/validate-v3-results.cjs .. "$RUNNER_TEMP/archlab-v3-contract/node_modules"

      - name: Install existing frontend tooling for typed client verification
        working-directory: frontend
        run: npm install
      - name: Verify real frontend/backend integration
        working-directory: .
        env:
          ARCHLAB_API_URL: http://localhost:18083
        run: |
          java -jar backend/archlab-api/target/archlab-api-0.1.0-SNAPSHOT.jar --server.port=18083 > "$RUNNER_TEMP/archlab-v3-server.log" 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID"' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --output /dev/null http://localhost:18083/; then break; fi
            sleep 0.5
          done
          node frontend/scripts/integration.mjs
          node frontend/scripts/integration-v3.mjs
          node frontend/scripts/integration-v3-client.mjs
